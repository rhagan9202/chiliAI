playbooks:
  version: cms-playbooks-v1
  items:
  - id: provider_billing_spike_review
    version: v1
    title: Provider billing spike review
    summary: Review provider billing acceleration against baseline, peers, policy,
      and supporting records.
    status: draft
    typology_ids:
    - billing_spike
    feature_ids:
    - weekly_provider_billing_zscore
    - weekly_provider_claim_count_zscore
    - anomalous_claim_score
    policy_rule_ids:
    - billing_thresholds.claim_over_billed
    evidence_requirements:
    - id: risk_projection
      label: Risk projection
      description: Current risk score, score age, and top contributing features.
      source_types:
      - risk_projection
      - feature_value
      required: true
    - id: peer_context
      label: Peer context
      description: Peer cohort distribution and z-score summary.
      source_types:
      - peer_analysis
      required: true
    workflow_steps:
    - id: review_risk_projection
      label: Review risk projection
      capability_ref: analytics.risk_projection.read
      input_refs:
      - knowledge_base_id
      - entity_id
      output_refs:
      - risk_summary
      requires_human_approval: false
    - id: verify_policy_threshold
      label: Verify policy threshold context
      capability_ref: policy.rules.read
      input_refs:
      - knowledge_base_id
      - entity_id
      - policy_rule_id
      output_refs:
      - policy_context
      requires_human_approval: false
    rag_prompts:
    - id: billing_spike_context
      model_ref: default
      prompt_version: v1
      system_prompt: Answer with cited evidence only.
      user_prompt: Summarize the billing spike evidence for {entity_id}.
    decision_guidance:
    - Open or attach a case when billing acceleration is corroborated by source records
      and peer context.
    - Record whether the policy threshold was triggered by claim amount or accumulated
      billing behavior.
    export_tags:
    - cms
    - billing
    - provider
  - id: peer_outlier_provider_review
    version: v1
    title: Peer outlier provider review
    summary: Review provider behavior against configured specialty and geography peer
      cohorts.
    status: draft
    typology_ids:
    - peer_outlier
    feature_ids:
    - specialty_peer_group_outlier
    - weekly_provider_billing_zscore
    - facility_concentration_ratio
    policy_rule_ids: []
    evidence_requirements:
    - id: peer_distribution
      label: Peer distribution
      description: Cohort membership, distribution, entity value, z-score, and percentile.
      source_types:
      - peer_analysis
      required: true
    - id: facility_context
      label: Facility context
      description: Facility concentration and related claim activity.
      source_types:
      - graph_metric
      - feature_value
      required: false
    workflow_steps:
    - id: gather_peer_context
      label: Gather peer context
      capability_ref: analytics.peer_analysis.read
      input_refs:
      - knowledge_base_id
      - entity_id
      output_refs:
      - peer_summary
      requires_human_approval: false
    rag_prompts:
    - id: peer_outlier_context
      model_ref: default
      prompt_version: v1
      system_prompt: Answer with cited evidence only.
      user_prompt: Explain why {entity_id} is an outlier compared with peers.
    decision_guidance:
    - Escalate only when the peer cohort is large enough and supporting evidence is
      available.
    - Compare peer outlier evidence with facility and claim context before assigning
      severity.
    export_tags:
    - cms
    - peer
    - provider
  - id: identity_mismatch_review
    version: v1
    title: Identity mismatch review
    summary: Review source identities and merge or split history before relying on
      the canonical entity.
    status: draft
    typology_ids:
    - identity_mismatch
    feature_ids:
    - identity_link_confidence
    policy_rule_ids: []
    evidence_requirements:
    - id: identity_links
      label: Identity links
      description: Canonical and source identity links with confidence and review
        state.
      source_types:
      - identity_link
      required: true
    workflow_steps:
    - id: inspect_identity_links
      label: Inspect identity links
      capability_ref: identity.canonical.read
      input_refs:
      - knowledge_base_id
      - entity_id
      output_refs:
      - identity_summary
      requires_human_approval: false
    rag_prompts:
    - id: identity_context
      model_ref: default
      prompt_version: v1
      system_prompt: Answer with cited evidence only.
      user_prompt: Summarize identity-link evidence and unresolved review states for
        {entity_id}.
    decision_guidance:
    - Do not treat a low-confidence identity merge as decisive until a steward review
      is complete.
    - Preserve source identity evidence when opening or updating the case.
    export_tags:
    - cms
    - identity
policy_rules:
- id: billing_thresholds
  name: Billing thresholds
  description: Flag claims whose billed amount exceeds the configured ceiling.
  thresholds:
    max_billed_amount: 100
  rules:
  - id: claim_over_billed
    title_template: Claim {target_ref} exceeds the billing threshold
    severity: high
    target_kind: entity
    target_selector:
      entity_type: claim
    predicate:
      field: properties.amount
      op: gt
      value:
        literal: null
        config_ref: max_billed_amount
    citations:
    - citation_id: lcd-billing-001
      title: LCD billing-amount guidance
      source_ref: policy://medicare/lcd/billing-001
      excerpt: Claims above the LCD ceiling require documented justification.
- id: graph_scale
  name: Graph growth watch
  description: null
  thresholds:
    max_entities: 100000
  rules:
  - id: kb_entity_volume
    title_template: Knowledge base {target_ref} crossed the entity-volume watch line
    severity: medium
    target_kind: metric
    target_selector:
      metric_name: entity_count
    predicate:
      field: metric.entity_count
      op: gt
      value:
        literal: null
        config_ref: max_entities
    citations: []
alerts:
  thresholds:
    provider:
      risk_score: 0.75
      anomaly_sigma: 2.5
    beneficiary:
      risk_score: 0.8
    claim:
      amount_percentile: 99.0
