[project]
name = "chili-backend"
version = "0.1.0"
description = "chiliAI backend — FastAPI gateway, pipeline workers, and analytics modules for a domain-reconfigurable Graph RAG analytics platform."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    # starlette >= 1.3.1 fixes CVE-2026-54282/54283. Its newer TestClient stubs
    # type request methods as Unknown, which only affects test code; that noise is
    # scoped off via the tests executionEnvironment in [tool.pyright] below.
    "starlette>=1.3.1",
    "httpx>=0.28",
    "openpyxl>=3.1",
    "python-multipart>=0.0.9",
    "uvicorn[standard]>=0.34",
    "pypdf>=5.4",
    # redis < 8: the 8.x response stubs change types so existing casts read as
    # unnecessary (reportUnnecessaryCast). No redis CVE requires the upgrade.
    "redis>=5.0,<8",
    "pydantic>=2.0",
    "pyyaml>=6.0",
    "python-docx>=1.1",
    "structlog>=24.0",
    "prometheus-client>=0.20",
]

[project.optional-dependencies]
dev = [
    "httpx2>=2.0",
    "hypothesis>=6.100",
    "moto[s3]>=5.0",
    "pyright==1.1.409",
    "pytest>=8.0",
    "pytest-cov>=6.0",
    # ruff < 0.16: 0.16.0 changed lint/import-sorting defaults, flagging ~800
    # findings across the codebase that 0.15.x accepts. Pin to the verified
    # series so CI matches the local toolchain; upgrade deliberately.
    "ruff>=0.15.13,<0.16",
]
neo4j = [
    "neo4j>=5,<6",
]
qdrant = [
    "qdrant-client[grpc]>=1.9",
]
sentence-transformers = [
    "sentence-transformers>=3.0",
]
openai = [
    "openai>=1.76",
]
anthropic = [
    "anthropic>=0.51",
]
s3 = [
    "boto3>=1.34",
]
ocr = [
    "pdf2image>=1.17",
    "pytesseract>=0.3.10",
]
analytics = [
    "statsmodels>=0.14",
    "scikit-learn>=1.4",
    "networkx>=3.0",
    "numpy>=1.26",
    "shap>=0.43",
    "numba>=0.65.1",
    "llvmlite>=0.47.0",
]
auth = [
    "python-jose[cryptography]>=3.3",
]
postgres = [
    "psycopg[binary]>=3.2",
    "psycopg-pool>=3.2",
    "alembic>=1.13",
]
observability = [
    "opentelemetry-api>=1.20",
    "opentelemetry-sdk>=1.20",
    "opentelemetry-instrumentation-fastapi>=0.40b0",
    "opentelemetry-exporter-otlp>=1.20",
]

[build-system]
requires = ["setuptools>=75.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["api*", "agent*", "shared*", "config*", "events*", "storage*",
           "ingestion*", "graph*", "vectorstore*", "embeddings*", "rag*",
           "llm*", "analytics*", "monitoring*", "database*", "records*",
           "conversations*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "integration: tests that require external services or optional dependencies",
    "e2e: end-to-end pipeline tests that exercise multiple modules through public APIs",
]

[tool.coverage.run]
omit = ["database/migrations/*"]

[tool.pyright]
pythonVersion = "3.12"
typeCheckingMode = "strict"
venvPath = "."
venv = ".venv"
# Kept to "." only. The repo-root tools/ package (tools/pyrightconfig.json)
# used to be reached from here via extraPaths ".." + an "../tools" include
# entry; a since-deleted backend/tools/ package that shared the bare
# top-level name "tools" forced the split (pyright resolves a dotted module
# name to a single filesystem location program-wide, so with both "." and
# ".." reachable every `import tools` silently resolved to one of the two).
# backend/tools/ is gone (analytics.34 removed the demo trigger), but the
# split configuration is kept: the repo-root tools/ package is
# typechecked by its own standalone tools/pyrightconfig.json (see
# .github/workflows/ci.yml's separate "Type-check tools/" step) instead of
# being pulled into this program.
extraPaths = ["."]
include = [
    "agent",
    "conversations",
    "analytics/gnn",
    "analytics/metrics",
    "analytics/peerstats",
    "analytics/risk",
    "analytics/timeseries",
    "embeddings",
    "api/_kb_projection.py",
    "api/_workflow_projection.py",
    "api/middleware/auth.py",
    "api/middleware/rbac.py",
    "api/middleware/session_store.py",
    "api/routers/alerts.py",
    "api/routers/records.py",
    "api/routers/investigation.py",
    "api/routers/knowledgebases.py",
    "api/routers/workflows.py",
    "api/routers/ws.py",
    "config",
    "database",
    "events",
    "graph",
    "ingestion",
    "monitoring",
    "playbooks",
    "policy",
    "records",
    "shared/metrics.py",
    "vectorstore",
    "tests/agent",
    "tests/conversations",
    "tests/analytics/gnn",
    "tests/analytics/metrics",
    "tests/analytics/peerstats",
    "tests/analytics/risk",
    "tests/analytics/timeseries",
    "tests/embeddings",
    "tests/api/test_chat_router.py",
    "tests/api/test_investigation_router.py",
    "tests/api/test_kb_projection.py",
    "tests/api/test_metrics.py",
    "tests/api/test_monitoring_source_selection.py",
    "tests/api/test_policy_registry.py",
    "tests/api/test_production_guardrail.py",
    "tests/api/test_records_router.py",
    "tests/api/test_ws_router.py",
    "tests/api/test_workflow_projection.py",
    "tests/api/test_workflows_router.py",
    "tests/config",
    "tests/database",
    "tests/e2e",
    "tests/events",
    "tests/graph",
    "tests/ingestion",
    "tests/monitoring/test_alert_history_writer.py",
    "tests/monitoring/test_observation_writer.py",
    "tests/monitoring/test_postgres_alert_history.py",
    "tests/monitoring/test_postgres_observation_store.py",
    "tests/monitoring/test_postgres_observation_source.py",
    "tests/playbooks",
    "tests/policy",
    "tests/records",
    "tests/shared/test_metrics.py",
    "tests/vectorstore",
]
exclude = ["**/__pycache__", "chili_backend.egg-info"]

# starlette >= 1.3.x types TestClient request methods (.get/.post/...) as Unknown,
# which cascades reportUnknown* errors through every test that calls the client.
# This is third-party stub noise confined to test code — production modules stay
# fully strict. Scope just those three rules off under tests/ (everything else,
# incl. missing-imports and general type issues, remains strict for tests).
[[tool.pyright.executionEnvironments]]
root = "tests"
reportUnknownMemberType = false
reportUnknownVariableType = false
reportUnknownArgumentType = false
