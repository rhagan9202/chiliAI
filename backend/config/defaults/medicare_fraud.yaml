domain:
  name: medicare_fraud
  display_name: "Medicare Fraud Detection"
  description: "Fraud detection and investigator support for Medicare claims"

entities:
  - name: provider
    display_label: "Provider"
    icon: stethoscope
    properties:
      npi: { type: string, display: "NPI", required: true, pattern: "^[0-9]{10}$" }
      # The name an analyst recognises. `ui.display_fields` titles a provider by
      # this and puts the NPI beneath it, so the alert feed, the workbench and
      # the graph all say the same thing (UXA-304).
      name: { type: string, display: "Provider Name" }
      specialty: { type: string, display: "Specialty" }
      state: { type: string, display: "State" }

  - name: beneficiary
    display_label: "Beneficiary"
    icon: person
    properties:
      hic_number: { type: string, display: "HIC Number", required: true }
      age: { type: integer, display: "Age", min_value: 0, max_value: 120 }
      chronic_conditions: { type: list, display: "Chronic Conditions" }

  - name: claim
    display_label: "Claim"
    icon: document
    properties:
      claim_id: { type: string, display: "Claim ID", required: true }
      amount: { type: decimal, display: "Billed Amount", required: true, min_value: 0 }
      service_date: { type: date, display: "Date of Service", required: true }
      procedure_codes: { type: list, display: "Procedure Codes" }

  - name: facility
    display_label: "Facility"
    icon: building
    properties:
      facility_id: { type: string, display: "Facility ID", required: true }
      name: { type: string, display: "Name" }
      type: { type: string, display: "Facility Type" }

relationships:
  - name: submitted_by
    display_label: "Submitted By"
    source: claim
    target: provider

  - name: billed_for
    display_label: "Billed For"
    source: claim
    target: beneficiary

  - name: performed_at
    display_label: "Performed At"
    source: claim
    target: facility

  - name: referred_by
    display_label: "Referred By"
    source: provider
    target: provider

capabilities:
  timeseries: true
  gnn: true
  risk_scoring: true
  rag_chat: true
  explainability: true
  structured_ingestion: true
  peer_stats: true

ingestion:
  chunking:
    strategy: recursive
    chunk_size: 1000
    chunk_overlap: 200
    min_chunk_size: 50
  sources:
    - type: file_upload
      formats: [pdf, docx, txt, csv, json]
    - type: api_push
      format: json
      endpoint: /ingest/claims

records:
  feeds:
    - name: claims_feed
      record_type: claim_record
      source: file_upload
      id_field: claim_id
      record_schema:
        claim_id: { type: string, display: "Claim ID", required: true }
        provider_npi: { type: string, display: "Provider NPI", required: true, pattern: "^[0-9]{10}$" }
        provider_specialty: { type: string, display: "Provider Specialty" }
        provider_state: { type: string, display: "Provider State" }
        service_category: { type: string, display: "Service Category" }
        billed_amount: { type: decimal, display: "Billed Amount", required: true, min_value: 0 }
        service_date: { type: date, display: "Date of Service", required: true }
        anomaly_score: { type: decimal, display: "Anomaly Score", required: true, min_value: 0, max_value: 1 }
      entities:
        - entity_type: claim
          id_field: claim_id
          property_fields:
            claim_id: claim_id
            amount: billed_amount
            service_date: service_date
        - entity_type: provider
          id_field: provider_npi
          property_fields:
            npi: provider_npi
      relationships:
        - relationship_type: submitted_by
          source_entity_type: claim
          target_entity_type: provider
      observations:
        - metric_name: claim_anomaly
          entity_type: claim
          score_field: anomaly_score
          rationale: "Anomaly score derived from the structured claims feed."

peer_stats:
  metrics:
    - name: weekly_provider_billing
      record_type: claim_record
      entity_type: provider
      entity_id_field: provider_npi
      value_column: billed_amount
      aggregation: sum
      interval: week
      time_column: service_date
      direction: high
      z_cap: 4.0
      weight: 1.6
      min_peers: 5
    - name: weekly_provider_claim_count
      record_type: claim_record
      entity_type: provider
      entity_id_field: provider_npi
      value_column: billed_amount
      aggregation: count
      interval: week
      time_column: service_date
      direction: high
      z_cap: 4.0
      weight: 1.0
      min_peers: 5
  cohorts:
    - id: provider_specialty_billing
      label: "Provider specialty billing peers"
      entity_type: provider
      peer_metric: weekly_provider_billing
      group_by: [provider_specialty]
      min_cohort_size: 5
      version: v1
    - id: provider_geography_billing
      label: "Provider geography billing peers"
      entity_type: provider
      peer_metric: weekly_provider_billing
      group_by: [provider_state]
      min_cohort_size: 5
      version: v1
    - id: provider_service_mix_claim_count
      label: "Provider service-mix claim-count peers"
      entity_type: provider
      peer_metric: weekly_provider_claim_count
      group_by: [service_category]
      min_cohort_size: 5
      version: v1

policy_rules:
  - id: billing_thresholds
    name: "Billing thresholds"
    description: "Flag claims whose billed amount exceeds the configured ceiling."
    thresholds:
      max_billed_amount: 5000
    rules:
      - id: claim_over_billed
        title_template: "Claim {target_ref} exceeds the billing threshold"
        severity: high
        target_kind: entity
        target_selector:
          entity_type: claim
        predicate:
          field: properties.amount
          op: gt
          value:
            config_ref: max_billed_amount
        citations:
          - citation_id: lcd-billing-001
            title: "LCD billing-amount guidance"
            source_ref: "policy://medicare/lcd/billing-001"
            excerpt: "Claims above the LCD ceiling require documented justification."
  - id: graph_scale
    name: "Graph growth watch"
    thresholds:
      max_entities: 100000
    rules:
      - id: kb_entity_volume
        title_template: "Knowledge base {target_ref} crossed the entity-volume watch line"
        severity: medium
        target_kind: metric
        target_selector:
          metric_name: entity_count
        predicate:
          field: metric.entity_count
          op: gt
          value:
            config_ref: max_entities

typologies:
  - id: dmepos_overutilization
    label: "DMEPOS overutilization"
    description: "Provider, claim, or beneficiary patterns indicating unusually dense DMEPOS billing."
    entity_types: [provider, claim, beneficiary]
    severity_hint: high
    feature_ids:
      - dmepos_code_exposure
      - beneficiary_high_utilization_count
      - repeated_procedure_code_density
      - weekly_provider_claim_count_zscore
  - id: billing_spike
    label: "Billing spike"
    description: "Provider billing volume or amount increased beyond peer and historical norms."
    entity_types: [provider, claim]
    severity_hint: high
    playbook_ids:
      - provider_billing_spike_review
    feature_ids:
      - weekly_provider_billing_zscore
      - weekly_provider_claim_count_zscore
      - service_date_burstiness
      - anomalous_claim_score
    policy_rule_ids:
      - billing_thresholds.claim_over_billed
  - id: peer_outlier
    label: "Peer outlier"
    description: "Provider or facility behavior sits outside expected specialty or facility peer groups."
    entity_types: [provider, facility]
    severity_hint: medium
    playbook_ids:
      - peer_outlier_provider_review
    feature_ids:
      - specialty_peer_group_outlier
      - facility_concentration_ratio
      - weekly_provider_billing_zscore
  - id: referral_ring_exposure
    label: "Referral ring exposure"
    description: "Referral graph structure suggests concentrated or reciprocal provider activity."
    entity_types: [provider, beneficiary]
    severity_hint: high
    feature_ids:
      - provider_referral_outdegree
      - provider_referral_indegree
      - shared_beneficiary_density
  - id: geographic_anomaly
    label: "Geographic anomaly"
    description: "Billing or service patterns are unusual for the provider state or service geography."
    entity_types: [provider, claim, facility]
    severity_hint: medium
    feature_ids:
      - geographic_state_outlier
      - facility_concentration_ratio
      - service_date_burstiness
  - id: enrollment_risk
    label: "Enrollment risk"
    description: "Provider enrollment recency or age patterns elevate fraud-screening concern."
    entity_types: [provider]
    severity_hint: medium
    feature_ids:
      - enrollment_age_risk
      - specialty_peer_group_outlier
      - evidence_pack_confidence
  - id: never_provided_service
    label: "Never provided service"
    description: "Evidence indicates a billed service was not provided or lacks supporting documentation."
    entity_types: [claim, provider, beneficiary]
    severity_hint: critical
    feature_ids:
      - never_provided_service_signal
      - cross_kb_policy_citation_count
      - evidence_pack_confidence
  - id: policy_threshold_exposure
    label: "Policy threshold exposure"
    description: "Claim or provider activity triggers configured CMS policy thresholds."
    entity_types: [claim, provider]
    severity_hint: high
    feature_ids:
      - claim_amount_threshold_exposure
      - policy_billing_threshold_hits
      - cross_kb_policy_citation_count
    policy_rule_ids:
      - billing_thresholds.claim_over_billed
  - id: identity_mismatch
    label: "Identity mismatch"
    description: "Source identity links need analyst review before the canonical entity can be trusted."
    entity_types: [provider, beneficiary]
    severity_hint: medium
    playbook_ids:
      - identity_mismatch_review
    feature_ids:
      - identity_link_confidence

playbooks:
  version: cms-playbooks-v1
  items:
    - id: provider_billing_spike_review
      version: v1
      title: Provider billing spike review
      summary: Review provider billing acceleration against baseline, peers, policy, and supporting records.
      status: draft
      typology_ids: [billing_spike]
      feature_ids:
        - weekly_provider_billing_zscore
        - weekly_provider_claim_count_zscore
        - anomalous_claim_score
      policy_rule_ids:
        - billing_thresholds.claim_over_billed
      evidence_requirements:
        - id: risk_projection
          label: Risk projection
          description: Current risk score, score age, and top contributing features.
          source_types: [risk_projection, feature_value]
          required: true
        - id: peer_context
          label: Peer context
          description: Peer cohort distribution and z-score summary.
          source_types: [peer_analysis]
          required: true
      workflow_steps:
        - id: review_risk_projection
          label: Review risk projection
          capability_ref: analytics.risk_projection.read
          input_refs: [knowledge_base_id, entity_id]
          output_refs: [risk_summary]
          requires_human_approval: false
        - id: verify_policy_threshold
          label: Verify policy threshold context
          capability_ref: policy.rules.read
          input_refs: [knowledge_base_id, entity_id, policy_rule_id]
          output_refs: [policy_context]
          requires_human_approval: false
      rag_prompts:
        - id: billing_spike_context
          model_ref: default
          prompt_version: v1
          system_prompt: Answer with cited evidence only.
          user_prompt: Summarize the billing spike evidence for {entity_id}.
      decision_guidance:
        - Open or attach a case when billing acceleration is corroborated by source records and peer context.
        - Record whether the policy threshold was triggered by claim amount or accumulated billing behavior.
      export_tags: [cms, billing, provider]
    - id: peer_outlier_provider_review
      version: v1
      title: Peer outlier provider review
      summary: Review provider behavior against configured specialty and geography peer cohorts.
      status: draft
      typology_ids: [peer_outlier]
      feature_ids:
        - specialty_peer_group_outlier
        - weekly_provider_billing_zscore
        - facility_concentration_ratio
      policy_rule_ids: []
      evidence_requirements:
        - id: peer_distribution
          label: Peer distribution
          description: Cohort membership, distribution, entity value, z-score, and percentile.
          source_types: [peer_analysis]
          required: true
        - id: facility_context
          label: Facility context
          description: Facility concentration and related claim activity.
          source_types: [graph_metric, feature_value]
          required: false
      workflow_steps:
        - id: gather_peer_context
          label: Gather peer context
          capability_ref: analytics.peer_analysis.read
          input_refs: [knowledge_base_id, entity_id]
          output_refs: [peer_summary]
          requires_human_approval: false
      rag_prompts:
        - id: peer_outlier_context
          model_ref: default
          prompt_version: v1
          system_prompt: Answer with cited evidence only.
          user_prompt: Explain why {entity_id} is an outlier compared with peers.
      decision_guidance:
        - Escalate only when the peer cohort is large enough and supporting evidence is available.
        - Compare peer outlier evidence with facility and claim context before assigning severity.
      export_tags: [cms, peer, provider]
    - id: identity_mismatch_review
      version: v1
      title: Identity mismatch review
      summary: Review source identities and merge or split history before relying on the canonical entity.
      status: draft
      typology_ids: [identity_mismatch]
      feature_ids:
        - identity_link_confidence
      policy_rule_ids: []
      evidence_requirements:
        - id: identity_links
          label: Identity links
          description: Canonical and source identity links with confidence and review state.
          source_types: [identity_link]
          required: true
      workflow_steps:
        - id: inspect_identity_links
          label: Inspect identity links
          capability_ref: identity.canonical.read
          input_refs: [knowledge_base_id, entity_id]
          output_refs: [identity_summary]
          requires_human_approval: false
      rag_prompts:
        - id: identity_context
          model_ref: default
          prompt_version: v1
          system_prompt: Answer with cited evidence only.
          user_prompt: Summarize identity-link evidence and unresolved review states for {entity_id}.
      decision_guidance:
        - Do not treat a low-confidence identity merge as decisive until a steward review is complete.
        - Preserve source identity evidence when opening or updating the case.
      export_tags: [cms, identity]

feature_catalog:
  version: cms-fraud-features-v1
  features:
    - id: weekly_provider_billing_zscore
      label: "Weekly provider billing z-score"
      description: "Peer-normalized weekly billed amount for a provider."
      value_type: decimal
      entity_types: [provider]
      source_mappings:
        - source_type: peer_metric
          source_ref: peer_stats.weekly_provider_billing
          raw_fields: [billed_amount, service_date, provider_npi]
      peer_dimensions: [provider]
      threshold_hints: { high: 2.0, critical: 3.0 }
      transformation_version: peerstats-zscore-v1
      typology_ids: [billing_spike, peer_outlier]
    - id: weekly_provider_claim_count_zscore
      label: "Weekly provider claim-count z-score"
      description: "Peer-normalized weekly claim count for a provider."
      value_type: decimal
      entity_types: [provider]
      source_mappings:
        - source_type: peer_metric
          source_ref: peer_stats.weekly_provider_claim_count
          raw_fields: [claim_id, service_date, provider_npi]
      peer_dimensions: [provider]
      threshold_hints: { high: 2.0, critical: 3.0 }
      transformation_version: peerstats-zscore-v1
      typology_ids: [dmepos_overutilization, billing_spike]
    - id: claim_amount_threshold_exposure
      label: "Claim amount threshold exposure"
      description: "Claim billed amount compared with the configured policy threshold."
      value_type: decimal
      entity_types: [claim]
      source_mappings:
        - source_type: policy_rule
          source_ref: policy_rules.billing_thresholds.claim_over_billed
          raw_fields: [claim_id, billed_amount]
      threshold_hints: { high: 5000.0 }
      transformation_version: policy-threshold-v1
      typology_ids: [policy_threshold_exposure]
    - id: anomalous_claim_score
      label: "Anomalous claim score"
      description: "Normalized anomaly score supplied by the structured claims feed."
      value_type: decimal
      entity_types: [claim]
      source_mappings:
        - source_type: records_feed
          source_ref: records.claims_feed.observations.claim_anomaly
          raw_fields: [claim_id, anomaly_score]
      threshold_hints: { high: 0.75, critical: 0.9 }
      transformation_version: claim-anomaly-v1
      typology_ids: [billing_spike]
    - id: provider_referral_outdegree
      label: "Provider referral outdegree"
      description: "Count of outgoing provider-to-provider referral relationships."
      value_type: integer
      entity_types: [provider]
      source_mappings:
        - source_type: graph_metric
          source_ref: relationships.referred_by.outdegree
          raw_fields: [source_provider_npi, target_provider_npi]
      threshold_hints: { high: 20.0, critical: 50.0 }
      transformation_version: graph-degree-v1
      typology_ids: [referral_ring_exposure]
    - id: provider_referral_indegree
      label: "Provider referral indegree"
      description: "Count of incoming provider-to-provider referral relationships."
      value_type: integer
      entity_types: [provider]
      source_mappings:
        - source_type: graph_metric
          source_ref: relationships.referred_by.indegree
          raw_fields: [source_provider_npi, target_provider_npi]
      threshold_hints: { high: 20.0, critical: 50.0 }
      transformation_version: graph-degree-v1
      typology_ids: [referral_ring_exposure]
    - id: shared_beneficiary_density
      label: "Shared beneficiary density"
      description: "Density of beneficiaries shared across connected providers."
      value_type: decimal
      entity_types: [provider, beneficiary]
      source_mappings:
        - source_type: graph_metric
          source_ref: relationships.billed_for.shared_beneficiaries
          raw_fields: [provider_npi, hic_number, claim_id]
      threshold_hints: { high: 0.4, critical: 0.65 }
      transformation_version: shared-beneficiary-density-v1
      typology_ids: [referral_ring_exposure]
    - id: geographic_state_outlier
      label: "Geographic state outlier"
      description: "Provider or claim behavior outside expected state-level patterns."
      value_type: decimal
      entity_types: [provider, claim, facility]
      source_mappings:
        - source_type: derived_signal
          source_ref: entity_derived_signals.geographic_state_outlier
          raw_fields: [state, claim_id, facility_id]
      peer_dimensions: [state]
      threshold_hints: { high: 2.0, critical: 3.0 }
      transformation_version: geo-outlier-v1
      typology_ids: [geographic_anomaly]
    - id: specialty_peer_group_outlier
      label: "Specialty peer group outlier"
      description: "Provider score relative to peers in the same specialty."
      value_type: decimal
      entity_types: [provider]
      source_mappings:
        - source_type: derived_signal
          source_ref: entity_derived_signals.specialty_peer_group_outlier
          raw_fields: [provider_npi, specialty, billed_amount]
      peer_dimensions: [specialty]
      threshold_hints: { high: 2.0, critical: 3.0 }
      transformation_version: specialty-peer-v1
      typology_ids: [peer_outlier, enrollment_risk]
    - id: beneficiary_chronic_condition_complexity
      label: "Beneficiary chronic condition complexity"
      description: "Count or normalized complexity of beneficiary chronic conditions."
      value_type: decimal
      entity_types: [beneficiary]
      source_mappings:
        - source_type: records_feed
          source_ref: entities.beneficiary.properties.chronic_conditions
          raw_fields: [hic_number, chronic_conditions]
      threshold_hints: { high: 6.0, critical: 10.0 }
      transformation_version: chronic-condition-complexity-v1
      typology_ids: [dmepos_overutilization]
    - id: beneficiary_high_utilization_count
      label: "Beneficiary high-utilization count"
      description: "Count of high-utilization claim events associated with a beneficiary."
      value_type: integer
      entity_types: [beneficiary]
      source_mappings:
        - source_type: graph_metric
          source_ref: relationships.billed_for.claim_count
          raw_fields: [hic_number, claim_id, service_date]
      threshold_hints: { high: 12.0, critical: 24.0 }
      transformation_version: beneficiary-utilization-v1
      typology_ids: [dmepos_overutilization]
    - id: facility_concentration_ratio
      label: "Facility concentration ratio"
      description: "Share of provider or claim activity concentrated at a facility."
      value_type: decimal
      entity_types: [facility, provider, claim]
      source_mappings:
        - source_type: graph_metric
          source_ref: relationships.performed_at.concentration
          raw_fields: [facility_id, provider_npi, claim_id]
      threshold_hints: { high: 0.5, critical: 0.8 }
      transformation_version: facility-concentration-v1
      typology_ids: [peer_outlier, geographic_anomaly]
    - id: repeated_procedure_code_density
      label: "Repeated procedure-code density"
      description: "Density of repeated procedure codes across a provider or beneficiary."
      value_type: decimal
      entity_types: [provider, beneficiary, claim]
      source_mappings:
        - source_type: records_feed
          source_ref: records.claims_feed.procedure_code_density
          raw_fields: [claim_id, provider_npi, procedure_codes]
      threshold_hints: { high: 0.35, critical: 0.6 }
      transformation_version: procedure-density-v1
      typology_ids: [dmepos_overutilization]
    - id: service_date_burstiness
      label: "Service-date burstiness"
      description: "Concentration of services in short date windows."
      value_type: decimal
      entity_types: [provider, claim]
      source_mappings:
        - source_type: timeseries_metric
          source_ref: timeseries.service_date_burstiness
          raw_fields: [provider_npi, claim_id, service_date]
      threshold_hints: { high: 2.0, critical: 3.0 }
      transformation_version: service-date-burst-v1
      typology_ids: [billing_spike, geographic_anomaly]
    - id: policy_billing_threshold_hits
      label: "Policy billing threshold hits"
      description: "Count of claims matching configured billing threshold rules."
      value_type: integer
      entity_types: [claim, provider]
      source_mappings:
        - source_type: policy_rule
          source_ref: policy_rules.billing_thresholds
          raw_fields: [claim_id, billed_amount]
      threshold_hints: { high: 1.0, critical: 3.0 }
      transformation_version: policy-hit-count-v1
      typology_ids: [policy_threshold_exposure]
    - id: enrollment_age_risk
      label: "Enrollment age risk"
      description: "Risk signal based on provider enrollment age or recency."
      value_type: decimal
      entity_types: [provider]
      source_mappings:
        - source_type: derived_signal
          source_ref: entity_derived_signals.enrollment_age_risk
          raw_fields: [provider_npi, enrollment_date]
      threshold_hints: { high: 0.7, critical: 0.9 }
      transformation_version: enrollment-age-v1
      typology_ids: [enrollment_risk]
    - id: never_provided_service_signal
      label: "Never-provided service signal"
      description: "Evidence-backed indicator that a billed service was not provided."
      value_type: boolean
      entity_types: [claim, provider, beneficiary]
      source_mappings:
        - source_type: evidence_pack
          source_ref: evidence.never_provided_service
          raw_fields: [claim_id, provider_npi, hic_number]
      threshold_hints: { high: 1.0, critical: 1.0 }
      transformation_version: never-provided-service-v1
      typology_ids: [never_provided_service]
    - id: dmepos_code_exposure
      label: "DMEPOS code exposure"
      description: "Share or count of DMEPOS-related procedure codes in claims."
      value_type: decimal
      entity_types: [provider, claim, beneficiary]
      source_mappings:
        - source_type: records_feed
          source_ref: records.claims_feed.dmepos_code_exposure
          raw_fields: [claim_id, provider_npi, procedure_codes]
      threshold_hints: { high: 0.4, critical: 0.7 }
      transformation_version: dmepos-code-exposure-v1
      typology_ids: [dmepos_overutilization]
    - id: cross_kb_policy_citation_count
      label: "Cross-KB policy citation count"
      description: "Count of relevant policy citations found across attached knowledge bases."
      value_type: integer
      entity_types: [claim, provider]
      source_mappings:
        - source_type: rag_evidence
          source_ref: knowledgebases.policy_graph.citations
          raw_fields: [claim_id, provider_npi, citation_id]
      threshold_hints: { high: 2.0, critical: 5.0 }
      transformation_version: cross-kb-citation-v1
      typology_ids: [never_provided_service, policy_threshold_exposure]
    - id: evidence_pack_confidence
      label: "Evidence pack confidence"
      description: "Normalized confidence score for the assembled investigator evidence pack."
      value_type: decimal
      entity_types: [provider, claim]
      source_mappings:
        - source_type: evidence_pack
          source_ref: evidence.packs.confidence
          raw_fields: [entity_id, claim_id, citation_id]
      threshold_hints: { high: 0.75, critical: 0.9 }
      transformation_version: evidence-pack-confidence-v1
      typology_ids: [enrollment_risk, never_provided_service]
    - id: identity_link_confidence
      label: "Identity link confidence"
      description: "Confidence and review status for source-to-canonical identity links."
      value_type: decimal
      entity_types: [provider, beneficiary]
      source_mappings:
        - source_type: identity_link
          source_ref: identity.links.confidence
          raw_fields: [entity_id, canonical_entity_id, review_state]
      threshold_hints: { high: 0.65, critical: 0.35 }
      transformation_version: identity-link-v1
      typology_ids: [identity_mismatch]

