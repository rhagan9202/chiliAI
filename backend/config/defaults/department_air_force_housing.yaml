domain:
  name: department_air_force_housing
  display_name: "Department of the Air Force Housing"
  description: "Executive visibility and scorecard automation for accompanied and unaccompanied Air Force housing."

entities:
  - name: installation
    display_label: "Installation"
    icon: building
    natural_key: [installation_id]
    properties:
      installation_id: { type: string, display: "Installation ID", required: true }
      name: { type: string, display: "Name", required: true }
      majcom: { type: string, display: "MAJCOM" }
      # Service branch of the installation (USAF | USSF); string per the frozen
      # feed-column contract (Interface 2).
      branch: { type: string, display: "Branch" }
      state: { type: string, display: "State" }
      latitude: { type: decimal, display: "Latitude" }
      longitude: { type: decimal, display: "Longitude" }

  - name: housing_asset
    display_label: "Housing Asset"
    icon: building
    natural_key: [asset_id]
    properties:
      asset_id: { type: string, display: "Asset ID", required: true }
      installation_id: { type: string, display: "Installation ID", required: true }
      category: { type: enum, display: "Category", enum_values: ["UH", "MFH"], required: true }
      asset_type: { type: string, display: "Asset Type" }

  - name: housing_inventory_snapshot
    display_label: "Inventory Snapshot"
    icon: document
    natural_key: [snapshot_id]
    properties:
      snapshot_id: { type: string, display: "Snapshot ID", required: true }
      installation_id: { type: string, display: "Installation ID", required: true }
      available_units: { type: integer, display: "Available Units", min_value: 0 }
      offline_units: { type: integer, display: "Offline Units", min_value: 0 }
      utilization_rate: { type: decimal, display: "Utilization Rate", min_value: 0, max_value: 1 }
      condition_index: { type: decimal, display: "Condition Index", min_value: 0, max_value: 100 }
      # FY2024 NDAA §2834 20%-of-replacement-cost certification inputs and the
      # 10 U.S.C. §2884(c)(7) unit-age element (Interface 2 additions).
      repair_backlog_usd: { type: decimal, display: "Repair Backlog (USD)", min_value: 0 }
      # Contract bound is strictly > 0; PropertyDefinition bounds are inclusive,
      # so 0.01 (smallest positive USD amount) encodes it.
      replacement_cost_usd: { type: decimal, display: "Replacement Cost (USD)", min_value: 0.01 }
      average_unit_age_years: { type: decimal, display: "Average Unit Age (Years)", min_value: 0 }
      snapshot_date: { type: date, display: "Snapshot Date", required: true }

  - name: population_demand_snapshot
    display_label: "Population Demand Snapshot"
    icon: person
    natural_key: [demand_id]
    properties:
      demand_id: { type: string, display: "Demand ID", required: true }
      installation_id: { type: string, display: "Installation ID", required: true }
      unaccompanied_authorized: { type: integer, display: "Unaccompanied Authorized", min_value: 0 }
      accompanied_authorized: { type: integer, display: "Accompanied Authorized", min_value: 0 }
      snapshot_date: { type: date, display: "Snapshot Date", required: true }

  - name: allowance_market_snapshot
    display_label: "Allowance And Market Snapshot"
    icon: chart
    natural_key: [market_id]
    properties:
      market_id: { type: string, display: "Market ID", required: true }
      installation_id: { type: string, display: "Installation ID", required: true }
      bah_rate: { type: decimal, display: "BAH Rate", min_value: 0 }
      available_rentals: { type: integer, display: "Available Rentals", min_value: 0 }
      affordability_index: { type: decimal, display: "Affordability Index", min_value: 0 }
      snapshot_date: { type: date, display: "Snapshot Date", required: true }

  - name: demographic_snapshot
    display_label: "Demographic Snapshot"
    icon: users
    natural_key: [demographic_id]
    properties:
      demographic_id: { type: string, display: "Demographic ID", required: true }
      installation_id: { type: string, display: "Installation ID", required: true }
      local_population: { type: integer, display: "Local Population", min_value: 0 }
      median_income: { type: decimal, display: "Median Income", min_value: 0 }
      snapshot_date: { type: date, display: "Snapshot Date", required: true }

  - name: resident_experience_snapshot
    display_label: "Resident Experience Snapshot"
    icon: clipboard
    natural_key: [experience_id]
    properties:
      experience_id: { type: string, display: "Experience ID", required: true }
      installation_id: { type: string, display: "Installation ID", required: true }
      category: { type: enum, display: "Category", enum_values: ["UH", "MFH"] }
      satisfaction_score: { type: decimal, display: "Satisfaction Score", min_value: 0, max_value: 100 }
      maintenance_response_hours: { type: decimal, display: "Maintenance Response (Hours)", min_value: 0 }
      open_work_orders: { type: integer, display: "Open Work Orders", min_value: 0 }
      work_orders_overdue: { type: integer, display: "Overdue Work Orders", min_value: 0 }
      work_order_completion_rate: { type: decimal, display: "Work Order Completion Rate", min_value: 0, max_value: 1 }
      disputes_filed: { type: integer, display: "Disputes Filed", min_value: 0 }
      disputes_resolved: { type: integer, display: "Disputes Resolved", min_value: 0 }
      dispute_payments_usd: { type: decimal, display: "Dispute Payments (USD)", min_value: 0 }
      # Mold/ventilation/fire-safety waivers per FY2026 NDAA §2822 (Interface 2).
      safety_waiver_count: { type: integer, display: "Safety Waiver Count", min_value: 0 }
      snapshot_date: { type: date, display: "Snapshot Date", required: true }

  - name: scorecard_run
    display_label: "Scorecard Run"
    icon: document
    natural_key: [run_id]
    properties:
      run_id: { type: string, display: "Run ID", required: true }
      template_id: { type: string, display: "Template ID", required: true }
      status: { type: string, display: "Status" }

relationships:
  - name: installation_has_asset
    display_label: "Has Asset"
    source: installation
    target: housing_asset

  - name: asset_has_inventory_snapshot
    display_label: "Has Inventory Snapshot"
    source: housing_asset
    target: housing_inventory_snapshot

  - name: installation_has_population_demand
    display_label: "Has Population Demand"
    source: installation
    target: population_demand_snapshot

  - name: installation_has_market_snapshot
    display_label: "Has Market Snapshot"
    source: installation
    target: allowance_market_snapshot

  - name: installation_has_demographic_snapshot
    display_label: "Has Demographic Snapshot"
    source: installation
    target: demographic_snapshot

  - name: installation_has_resident_experience
    display_label: "Has Resident Experience"
    source: installation
    target: resident_experience_snapshot

  - name: scorecard_run_for_installation
    display_label: "Scorecard For Installation"
    source: scorecard_run
    target: installation

capabilities:
  timeseries: true
  gnn: false
  risk_scoring: true
  rag_chat: true
  explainability: true
  structured_ingestion: true
  peer_stats: false

ingestion:
  chunking:
    strategy: recursive
    chunk_size: 1000
    chunk_overlap: 200
    min_chunk_size: 50
  sources:
    - type: file_upload
      formats: [pdf, docx, txt, csv, json, xlsx]

records:
  feeds:
    - name: umd_authorizations
      record_type: umd_authorization
      source: file_upload
      id_field: demand_id
      allow_extra_fields: true
      accepted_formats: [csv, jsonl]
      record_schema:
        demand_id: { type: string, display: "Demand ID", required: true }
        installation_id: { type: string, display: "Installation ID", required: true }
        installation_name: { type: string, display: "Installation Name", required: true }
        majcom: { type: string, display: "MAJCOM" }
        # Service branch (USAF | USSF) per Interface 2.
        branch: { type: string, display: "Branch" }
        state: { type: string, display: "State" }
        latitude: { type: decimal, display: "Latitude" }
        longitude: { type: decimal, display: "Longitude" }
        unaccompanied_authorized: { type: integer, display: "Unaccompanied Authorized", min_value: 0 }
        accompanied_authorized: { type: integer, display: "Accompanied Authorized", min_value: 0 }
        snapshot_date: { type: date, display: "Snapshot Date", required: true }
      entities:
        - entity_type: installation
          id_field: installation_id
          property_fields:
            installation_id: installation_id
            name: installation_name
            majcom: majcom
            branch: branch
            state: state
            latitude: latitude
            longitude: longitude
        - entity_type: population_demand_snapshot
          id_field: demand_id
          property_fields:
            demand_id: demand_id
            installation_id: installation_id
            unaccompanied_authorized: unaccompanied_authorized
            accompanied_authorized: accompanied_authorized
            snapshot_date: snapshot_date
      relationships:
        - relationship_type: installation_has_population_demand
          source_entity_type: installation
          target_entity_type: population_demand_snapshot
      # No observations: unaccompanied_authorized is a raw authorization
      # count (unbounded integer), not a score, so it cannot be proven to
      # normalize into MonitoringObservation's [0, 1] bound.  The former
      # unaccompanied_demand observation was removed rather than remapped —
      # this feed carries no naturally bounded field, and demand still reaches
      # the scorecards directly via record_feed inputs (uh_supply_ratio).

    - name: bah_rates
      record_type: bah_rate
      source: file_upload
      id_field: market_id
      allow_extra_fields: true
      accepted_formats: [csv, jsonl]
      record_schema:
        market_id: { type: string, display: "Market ID", required: true }
        installation_id: { type: string, display: "Installation ID", required: true }
        bah_rate: { type: decimal, display: "BAH Rate", min_value: 0 }
        available_rentals: { type: integer, display: "Available Rentals", min_value: 0 }
        # 0-100 index; max_value lets the market_pressure observation prove
        # its score_max: 100 normalization stays within [0, 1].
        affordability_index: { type: decimal, display: "Affordability Index", min_value: 0, max_value: 100 }
        snapshot_date: { type: date, display: "Snapshot Date", required: true }
      entities:
        - entity_type: installation
          id_field: installation_id
          property_fields:
            installation_id: installation_id
        - entity_type: allowance_market_snapshot
          id_field: market_id
          property_fields:
            market_id: market_id
            installation_id: installation_id
            bah_rate: bah_rate
            available_rentals: available_rentals
            affordability_index: affordability_index
            snapshot_date: snapshot_date
      relationships:
        - relationship_type: installation_has_market_snapshot
          source_entity_type: installation
          target_entity_type: allowance_market_snapshot
      observations:
        # affordability_index is a 0-100 index; score_max normalizes it into
        # the [0, 1] observation bound (scale conversion, never a clamp).
        - metric_name: market_pressure
          entity_type: allowance_market_snapshot
          score_field: affordability_index
          score_max: 100
          rationale: "Market pressure from allowance and rental availability export."

    - name: housing_inventory
      record_type: housing_inventory
      source: file_upload
      id_field: snapshot_id
      allow_extra_fields: true
      accepted_formats: [csv, jsonl]
      record_schema:
        snapshot_id: { type: string, display: "Snapshot ID", required: true }
        asset_id: { type: string, display: "Asset ID", required: true }
        installation_id: { type: string, display: "Installation ID", required: true }
        category: { type: enum, display: "Category", enum_values: ["UH", "MFH"], required: true }
        asset_type: { type: string, display: "Asset Type" }
        available_units: { type: integer, display: "Available Units", min_value: 0 }
        offline_units: { type: integer, display: "Offline Units", min_value: 0 }
        utilization_rate: { type: decimal, display: "Utilization Rate", min_value: 0, max_value: 1 }
        condition_index: { type: decimal, display: "Condition Index", min_value: 0, max_value: 100 }
        # FY2024 NDAA §2834 backlog/replacement-cost certification inputs and the
        # 10 U.S.C. §2884(c)(7) unit-age element (Interface 2 additions).
        repair_backlog_usd: { type: decimal, display: "Repair Backlog (USD)", min_value: 0 }
        # Contract bound is strictly > 0; PropertyDefinition bounds are inclusive,
        # so 0.01 (smallest positive USD amount) encodes it.
        replacement_cost_usd: { type: decimal, display: "Replacement Cost (USD)", min_value: 0.01 }
        average_unit_age_years: { type: decimal, display: "Average Unit Age (Years)", min_value: 0 }
        snapshot_date: { type: date, display: "Snapshot Date", required: true }
      entities:
        - entity_type: installation
          id_field: installation_id
          property_fields:
            installation_id: installation_id
        - entity_type: housing_asset
          id_field: asset_id
          property_fields:
            asset_id: asset_id
            installation_id: installation_id
            category: category
            asset_type: asset_type
        - entity_type: housing_inventory_snapshot
          id_field: snapshot_id
          property_fields:
            snapshot_id: snapshot_id
            installation_id: installation_id
            available_units: available_units
            offline_units: offline_units
            utilization_rate: utilization_rate
            condition_index: condition_index
            repair_backlog_usd: repair_backlog_usd
            replacement_cost_usd: replacement_cost_usd
            average_unit_age_years: average_unit_age_years
            snapshot_date: snapshot_date
      relationships:
        - relationship_type: installation_has_asset
          source_entity_type: installation
          target_entity_type: housing_asset
        - relationship_type: asset_has_inventory_snapshot
          source_entity_type: housing_asset
          target_entity_type: housing_inventory_snapshot
      observations:
        # condition_index is declared 0-100; score_max normalizes it into the
        # [0, 1] observation bound (scale conversion, never a clamp).
        - metric_name: housing_condition
          entity_type: housing_inventory_snapshot
          score_field: condition_index
          score_max: 100
          rationale: "Housing condition index from inventory export."

    - name: market_availability
      record_type: market_availability
      source: file_upload
      id_field: market_id
      allow_extra_fields: true
      accepted_formats: [csv, jsonl]
      record_schema:
        market_id: { type: string, display: "Market ID", required: true }
        installation_id: { type: string, display: "Installation ID", required: true }
        available_rentals: { type: integer, display: "Available Rentals", min_value: 0 }
        affordability_index: { type: decimal, display: "Affordability Index", min_value: 0 }
        snapshot_date: { type: date, display: "Snapshot Date", required: true }
      entities:
        - entity_type: installation
          id_field: installation_id
          property_fields:
            installation_id: installation_id
        - entity_type: allowance_market_snapshot
          id_field: market_id
          property_fields:
            market_id: market_id
            installation_id: installation_id
            available_rentals: available_rentals
            affordability_index: affordability_index
            snapshot_date: snapshot_date
      relationships:
        - relationship_type: installation_has_market_snapshot
          source_entity_type: installation
          target_entity_type: allowance_market_snapshot
      # No observations: available_rentals is a raw listing count (unbounded
      # integer), not a score, so it cannot be proven to normalize into
      # MonitoringObservation's [0, 1] bound.  The former rental_availability
      # observation was removed; availability still reaches the scorecards
      # directly via record_feed inputs, and market pressure is already
      # observed from the bounded affordability_index on the bah_rates feed.

    - name: area_demographics
      record_type: area_demographics
      source: file_upload
      id_field: demographic_id
      allow_extra_fields: true
      accepted_formats: [csv, jsonl]
      record_schema:
        demographic_id: { type: string, display: "Demographic ID", required: true }
        installation_id: { type: string, display: "Installation ID", required: true }
        local_population: { type: integer, display: "Local Population", min_value: 0 }
        median_income: { type: decimal, display: "Median Income", min_value: 0 }
        snapshot_date: { type: date, display: "Snapshot Date", required: true }
      entities:
        - entity_type: installation
          id_field: installation_id
          property_fields:
            installation_id: installation_id
        - entity_type: demographic_snapshot
          id_field: demographic_id
          property_fields:
            demographic_id: demographic_id
            installation_id: installation_id
            local_population: local_population
            median_income: median_income
            snapshot_date: snapshot_date
      relationships:
        - relationship_type: installation_has_demographic_snapshot
          source_entity_type: installation
          target_entity_type: demographic_snapshot
      # No observations: local_population is a raw population count
      # (unbounded integer), not a score, so it cannot be proven to normalize
      # into MonitoringObservation's [0, 1] bound.  The former
      # demographic_context observation was removed; demographic context
      # remains available on the demographic_snapshot entity properties.

    - name: resident_experience
      record_type: resident_experience
      source: file_upload
      id_field: experience_id
      allow_extra_fields: true
      accepted_formats: [csv, jsonl]
      record_schema:
        experience_id: { type: string, display: "Experience ID", required: true }
        installation_id: { type: string, display: "Installation ID", required: true }
        category: { type: enum, display: "Category", enum_values: ["UH", "MFH"] }
        satisfaction_score: { type: decimal, display: "Satisfaction Score", min_value: 0, max_value: 100 }
        maintenance_response_hours: { type: decimal, display: "Maintenance Response (Hours)", min_value: 0 }
        work_orders_open: { type: integer, display: "Open Work Orders", min_value: 0 }
        work_orders_overdue: { type: integer, display: "Overdue Work Orders", min_value: 0 }
        work_order_completion_rate: { type: decimal, display: "Work Order Completion Rate", min_value: 0, max_value: 1 }
        disputes_filed: { type: integer, display: "Disputes Filed", min_value: 0 }
        disputes_resolved: { type: integer, display: "Disputes Resolved", min_value: 0 }
        dispute_payments_usd: { type: decimal, display: "Dispute Payments (USD)", min_value: 0 }
        # Mold/ventilation/fire-safety waivers per FY2026 NDAA §2822 (Interface 2).
        safety_waiver_count: { type: integer, display: "Safety Waiver Count", min_value: 0 }
        snapshot_date: { type: date, display: "Snapshot Date", required: true }
      entities:
        - entity_type: installation
          id_field: installation_id
          property_fields:
            installation_id: installation_id
        - entity_type: resident_experience_snapshot
          id_field: experience_id
          property_fields:
            experience_id: experience_id
            installation_id: installation_id
            category: category
            satisfaction_score: satisfaction_score
            maintenance_response_hours: maintenance_response_hours
            open_work_orders: work_orders_open
            work_orders_overdue: work_orders_overdue
            work_order_completion_rate: work_order_completion_rate
            disputes_filed: disputes_filed
            disputes_resolved: disputes_resolved
            dispute_payments_usd: dispute_payments_usd
            safety_waiver_count: safety_waiver_count
            snapshot_date: snapshot_date
      relationships:
        - relationship_type: installation_has_resident_experience
          source_entity_type: installation
          target_entity_type: resident_experience_snapshot
      observations:
        # satisfaction_score is declared 0-100; score_max normalizes it into
        # the [0, 1] observation bound (scale conversion, never a clamp).
        # Kept as an observation: it is a real resident-experience signal.
        - metric_name: resident_satisfaction
          entity_type: resident_experience_snapshot
          score_field: satisfaction_score
          score_max: 100
          rationale: "Resident satisfaction from tenant experience export."

timeseries:
  metrics:
    - name: monthly_affordability_trend
      record_type: bah_rate
      entity_type: allowance_market_snapshot
      entity_id_field: market_id
      value_column: affordability_index
      aggregation: mean
      interval: month
      time_column: snapshot_date
      detection_strategy: z_score
      baseline_window: 3
      min_history: 5
      z_threshold: 2.0
      z_cap: 4.0
      signal_weight: 0.8

# Scorecard templates regenerated from the research dossier
# docs/research/housing-scorecard-mandates.md (§ 4.1 UH, § 4.2 MFH).
# Every metric carries a provenance comment: [statutory: cite] where the
# statute supplies the number, [judgement: rationale] otherwise; traceability
# matches the dossier's § 4 tables. Lower-is-better metrics use the mirrored
# pass_max/warn_max/fail_min keys (pass <= pass_max, warn <= warn_max,
# fail >= fail_min).
scorecards:
  templates:
    - id: uh_scorecard
      name: "Unaccompanied Housing Scorecard"
      category: UH
      scope: installation
      period: quarterly
      export_formats: [json, markdown]
      sections:
        - id: demand_supply
          label: "Demand and Supply"
          metrics:
            # UH #1 — traceability: FY2023 § 2821 (HRMA context); demo construct.
            # [judgement: 1:1 coverage of authorized unaccompanied demand;
            # supports HRMA-style requirements analysis]
            - id: uh_supply_ratio
              label: "UH Supply Ratio"
              description: "Available UH inventory divided by unaccompanied authorized demand."
              unit: ratio
              housing_category: UH
              inputs:
                - name: supply
                  source: record_feed
                  ref: housing_inventory
                  field: available_units
                  filter: { category: UH }
                - name: demand
                  source: record_feed
                  ref: umd_authorizations
                  field: unaccompanied_authorized
              formula: { operator: ratio, numerator: supply, denominator: demand }
              thresholds: { pass_min: 1.0, warn_min: 0.9, fail_max: 0.89, incomplete_when_missing: true }
              freshness_days: 90
            # UH #2 — traceability: 10 U.S.C. § 2884(c)(2) analog (dossier § 6 caveat).
            # [judgement: 0.75 warn boundary borrowed by analogy from the
            # § 2884(c)(2) MFH occupancy financial-risk trigger; 0.90 is a
            # healthy-dorm-management target]
            - id: uh_utilization_rate
              label: "UH Utilization Rate"
              description: "Average UH utilization across inventory snapshots."
              unit: ratio
              housing_category: UH
              inputs:
                - name: utilization
                  source: record_feed
                  ref: housing_inventory
                  field: utilization_rate
                  filter: { category: UH }
              formula: { operator: mean, value: utilization }
              thresholds: { pass_min: 0.90, warn_min: 0.75, fail_max: 0.7499, incomplete_when_missing: true }
              freshness_days: 90
        - id: condition_recapitalization
          label: "Condition and Recapitalization"
          metrics:
            # UH #3 — traceability: FY2024 § 2838 (DOD-wide UH condition index).
            # [judgement, DOD-band-aligned: pass = fair-or-better (>= 80),
            # warn = poor band (60-79), fail = failing band (< 60) per the DOD
            # condition-score convention documented in GAO-23-105797 p. 11 n.17]
            - id: uh_condition_index
              label: "UH Condition Index"
              description: "Unit-weighted UH condition index from inventory snapshots."
              unit: score
              housing_category: UH
              inputs:
                - name: condition
                  source: record_feed
                  ref: housing_inventory
                  field: condition_index
                  filter: { category: UH }
                - name: units
                  source: record_feed
                  ref: housing_inventory
                  field: available_units
                  filter: { category: UH }
              formula: { operator: weighted_mean, value: condition, weight: units }
              thresholds: { pass_min: 80, warn_min: 60, fail_max: 59.99, incomplete_when_missing: true }
              freshness_days: 90
            # UH #4 — traceability: FY2024 § 2834 -> 10 U.S.C. § 2856b(c).
            # pass_max 0.20 [statutory: 10 U.S.C. § 2856b(c) annual certification
            # that UH repair and improvement needs do not exceed 20 percent of
            # replacement cost]; warn_max 0.25 [judgement: buffer above the
            # certification line]; fail_min 0.2501. Freshness 400: annual
            # certification submitted with the President's budget.
            - id: uh_repair_backlog_ratio
              label: "Repair Backlog vs Replacement Cost"
              description: "UH repair backlog divided by replacement cost (Section 2856b(c) certification line)."
              unit: ratio
              housing_category: UH
              inputs:
                - name: backlog
                  source: record_feed
                  ref: housing_inventory
                  field: repair_backlog_usd
                  filter: { category: UH }
                - name: replacement
                  source: record_feed
                  ref: housing_inventory
                  field: replacement_cost_usd
                  filter: { category: UH }
              formula: { operator: ratio, numerator: backlog, denominator: replacement }
              thresholds: { pass_max: 0.20, warn_max: 0.25, fail_min: 0.2501, incomplete_when_missing: true }
              freshness_days: 400
        - id: maintenance_performance
          label: "Maintenance Performance"
          metrics:
            # UH #5 — traceability: FY2024 § 2837; § 2884(c)(9) analog.
            # [judgement: statute mandates work-order metrics but sets no
            # target; 90% completion is a conventional facilities KPI]
            - id: uh_work_order_completion_rate
              label: "Work-Order Completion Rate"
              description: "Average UH work-order completion rate."
              unit: ratio
              housing_category: UH
              inputs:
                - name: completion
                  source: record_feed
                  ref: resident_experience
                  field: work_order_completion_rate
                  filter: { category: UH }
              formula: { operator: mean, value: completion }
              thresholds: { pass_min: 0.90, warn_min: 0.80, fail_max: 0.79, incomplete_when_missing: true }
              freshness_days: 90
            # UH #6 — traceability: FY2024 § 2837; § 2884(c)(9) analog.
            # [judgement: anchored to the 24-hour emergency/urgent response
            # convention in DOD housing management practice; statute requires
            # tracking response times without a number]
            - id: uh_maintenance_response_hours
              label: "Avg Maintenance Response (hrs)"
              description: "Average UH emergency/urgent maintenance response time in hours."
              unit: hours
              housing_category: UH
              inputs:
                - name: response_hours
                  source: record_feed
                  ref: resident_experience
                  field: maintenance_response_hours
                  filter: { category: UH }
              formula: { operator: mean, value: response_hours }
              thresholds: { pass_max: 24, warn_max: 48, fail_min: 48.01, incomplete_when_missing: true }
              freshness_days: 90
        - id: resident_experience_safety
          label: "Resident Experience and Safety"
          metrics:
            # UH #7 — traceability: FY2020 § 3058 (uniform survey incl.
            # government-owned housing). [judgement: calibrated to the DAF
            # 2020-21 tenant-satisfaction average of 77.2 and CEL's "very good"
            # band; no statutory target exists] Freshness 400: annual survey.
            - id: uh_resident_satisfaction
              label: "Resident Satisfaction Score"
              description: "Average UH resident satisfaction survey score."
              unit: score
              housing_category: UH
              inputs:
                - name: satisfaction
                  source: record_feed
                  ref: resident_experience
                  field: satisfaction_score
                  filter: { category: UH }
              formula: { operator: mean, value: satisfaction }
              thresholds: { pass_min: 75, warn_min: 65, fail_max: 64.99, incomplete_when_missing: true }
              freshness_days: 400
            # UH #8 — traceability: FY2026 § 2822; § 2856b(b) waiver authority.
            # [judgement: statute mandates reporting waiver counts with no
            # threshold; zero open waivers is the only defensible healthy
            # state, small non-zero counts warn]
            - id: uh_safety_waiver_count
              label: "Health/Safety Standard Waivers"
              description: "Count of UH health and safety standard waivers (mold, ventilation, fire safety)."
              unit: count
              housing_category: UH
              inputs:
                - name: waivers
                  source: record_feed
                  ref: resident_experience
                  field: safety_waiver_count
                  filter: { category: UH }
              formula: { operator: sum, value: waivers }
              thresholds: { pass_max: 0, warn_max: 2, fail_min: 3, incomplete_when_missing: true }
              freshness_days: 90

    - id: mfh_scorecard
      name: "Military Family Housing Scorecard"
      category: MFH
      scope: installation
      period: quarterly
      export_formats: [json, markdown]
      # Sections after Supply and Market implement the 10 U.S.C. § 2891c
      # minimum performance-metric categories (tenant satisfaction,
      # maintenance management, safety, financial management) plus the
      # § 2894 dispute-resolution instrument.
      sections:
        - id: family_housing_supply
          label: "Supply and Market"
          metrics:
            # MFH #1 — traceability: FY2023 § 2821 (HRMA context); demo construct.
            # [judgement: as UH #1 — 1:1 coverage of accompanied authorized demand]
            - id: mfh_supply_ratio
              label: "MFH Supply Ratio"
              description: "Available MFH inventory divided by accompanied authorized demand."
              unit: ratio
              housing_category: MFH
              inputs:
                - name: supply
                  source: record_feed
                  ref: housing_inventory
                  field: available_units
                  filter: { category: MFH }
                - name: demand
                  source: record_feed
                  ref: umd_authorizations
                  field: accompanied_authorized
              formula: { operator: ratio, numerator: supply, denominator: demand }
              thresholds: { pass_min: 1.0, warn_min: 0.9, fail_max: 0.89, incomplete_when_missing: true }
              freshness_days: 90
            # MFH #2 — traceability: FY2023 § 2821 (HRMA); § 2884(b)(2) BAH context.
            # [judgement: carried from existing pack; index is a synthetic
            # HRMA-style composite]
            - id: mfh_market_affordability
              label: "Local Market Affordability"
              description: "Average local market affordability index for family housing demand."
              unit: index
              housing_category: MFH
              inputs:
                - name: affordability
                  source: record_feed
                  ref: market_availability
                  field: affordability_index
              formula: { operator: mean, value: affordability }
              thresholds: { pass_min: 80, warn_min: 65, fail_max: 64.99, incomplete_when_missing: true }
              freshness_days: 90
        - id: financial_management
          label: "Financial Management"
          # § 2891c minimum category (4): financial management.
          metrics:
            # MFH #3 — traceability: § 2884(c)(2); § 2891c (financial management).
            # pass_min 0.90 [judgement: healthy project]; warn_min 0.75
            # [statutory boundary: 10 U.S.C. § 2884(c)(2) financial-risk
            # mitigation trigger when occupancy falls below 75 percent];
            # fail_max 0.7499 (below the trigger).
            - id: mfh_occupancy_rate
              label: "MFH Occupancy Rate"
              description: "Average MFH occupancy across inventory snapshots."
              unit: ratio
              housing_category: MFH
              inputs:
                - name: occupancy
                  source: record_feed
                  ref: housing_inventory
                  field: utilization_rate
                  filter: { category: MFH }
              formula: { operator: mean, value: occupancy }
              thresholds: { pass_min: 0.90, warn_min: 0.75, fail_max: 0.7499, incomplete_when_missing: true }
              freshness_days: 90
            # MFH #4 — traceability: § 2884(c)(1); threshold parity with § 2856b(c).
            # [judgement: parity with the UH statutory 20% line; § 2884(c)(1)
            # mandates backlog reporting with no number; wider warn band
            # because MFH recapitalization is project-financed]
            - id: mfh_repair_backlog_ratio
              label: "Repair Backlog vs Replacement Cost"
              description: "MFH repair backlog divided by replacement cost."
              unit: ratio
              housing_category: MFH
              inputs:
                - name: backlog
                  source: record_feed
                  ref: housing_inventory
                  field: repair_backlog_usd
                  filter: { category: MFH }
                - name: replacement
                  source: record_feed
                  ref: housing_inventory
                  field: replacement_cost_usd
                  filter: { category: MFH }
              formula: { operator: ratio, numerator: backlog, denominator: replacement }
              thresholds: { pass_max: 0.20, warn_max: 0.30, fail_min: 0.3001, incomplete_when_missing: true }
              freshness_days: 400
        - id: condition_recapitalization
          label: "Condition and Recapitalization"
          metrics:
            # MFH #5 — traceability: § 2884(c)(7); DOD bands per GAO-23-105797.
            # [judgement, DOD-band-aligned: as UH #3]
            - id: mfh_condition_index
              label: "MFH Condition Index"
              description: "Unit-weighted MFH condition index from inventory snapshots."
              unit: score
              housing_category: MFH
              inputs:
                - name: condition
                  source: record_feed
                  ref: housing_inventory
                  field: condition_index
                  filter: { category: MFH }
                - name: units
                  source: record_feed
                  ref: housing_inventory
                  field: available_units
                  filter: { category: MFH }
              formula: { operator: weighted_mean, value: condition, weight: units }
              thresholds: { pass_min: 80, warn_min: 60, fail_max: 59.99, incomplete_when_missing: true }
              freshness_days: 90
            # MFH #6 — traceability: § 2884(c)(7) (age-based condition assessment).
            # [judgement: § 2884(c)(7) requires age-based condition assessment
            # with no threshold; bands reflect multi-decade MHPI
            # recapitalization planning horizons]
            - id: mfh_average_unit_age
              label: "Average Unit Age (yrs)"
              description: "Average MFH unit age in years."
              unit: years
              housing_category: MFH
              inputs:
                - name: age
                  source: record_feed
                  ref: housing_inventory
                  field: average_unit_age_years
                  filter: { category: MFH }
              formula: { operator: mean, value: age }
              thresholds: { pass_max: 25, warn_max: 40, fail_min: 40.01, incomplete_when_missing: true }
              freshness_days: 90
        - id: maintenance_management
          label: "Maintenance Management"
          # § 2891c minimum category (2): maintenance management.
          metrics:
            # MFH #7 — traceability: § 2884(c)(9); § 2891c (maintenance
            # management); FY2026 § 2824. [judgement: as UH #5]
            - id: mfh_work_order_completion_rate
              label: "Work-Order Completion Rate"
              description: "Average MFH work-order completion rate."
              unit: ratio
              housing_category: MFH
              inputs:
                - name: completion
                  source: record_feed
                  ref: resident_experience
                  field: work_order_completion_rate
                  filter: { category: MFH }
              formula: { operator: mean, value: completion }
              thresholds: { pass_min: 0.90, warn_min: 0.80, fail_max: 0.79, incomplete_when_missing: true }
              freshness_days: 90
            # MFH #8 — traceability: § 2884(c)(9); § 2891c (maintenance
            # management). [judgement: as UH #6]
            - id: mfh_maintenance_response_hours
              label: "Avg Maintenance Response (hrs)"
              description: "Average MFH emergency/urgent maintenance response time in hours."
              unit: hours
              housing_category: MFH
              inputs:
                - name: response_hours
                  source: record_feed
                  ref: resident_experience
                  field: maintenance_response_hours
                  filter: { category: MFH }
              formula: { operator: mean, value: response_hours }
              thresholds: { pass_max: 24, warn_max: 48, fail_min: 48.01, incomplete_when_missing: true }
              freshness_days: 90
        - id: tenant_satisfaction
          label: "Tenant Satisfaction"
          # § 2891c minimum category (1): tenant satisfaction.
          metrics:
            # MFH #9 — traceability: FY2020 § 3058; § 2884(c)(13); § 2891c
            # (tenant satisfaction). [judgement: calibrated to DAF TSS 77.2
            # average, "very good" band] Freshness 400: annual survey.
            - id: mfh_resident_satisfaction
              label: "Resident Satisfaction Score"
              description: "Average MFH resident satisfaction survey score."
              unit: score
              housing_category: MFH
              inputs:
                - name: satisfaction
                  source: record_feed
                  ref: resident_experience
                  field: satisfaction_score
                  filter: { category: MFH }
              formula: { operator: mean, value: satisfaction }
              thresholds: { pass_min: 75, warn_min: 65, fail_max: 64.99, incomplete_when_missing: true }
              freshness_days: 400
        - id: safety
          label: "Safety"
          # § 2891c minimum category (3): safety.
          metrics:
            # MFH #10 — traceability: § 2891c (safety); FY2026 § 2822 (analog —
            # UH-originated construct). [judgement: operationalizes the § 2891c
            # safety category with the FY2026 § 2822 waiver-count construct;
            # see dossier § 6]
            - id: mfh_safety_waiver_count
              label: "Health/Safety Standard Waivers"
              description: "Count of MFH health and safety standard waivers (mold, ventilation, fire safety)."
              unit: count
              housing_category: MFH
              inputs:
                - name: waivers
                  source: record_feed
                  ref: resident_experience
                  field: safety_waiver_count
                  filter: { category: MFH }
              formula: { operator: sum, value: waivers }
              thresholds: { pass_max: 0, warn_max: 2, fail_min: 3, incomplete_when_missing: true }
              freshness_days: 90
        - id: dispute_resolution
          label: "Dispute Resolution"
          metrics:
            # MFH #11 — traceability: § 2894; § 2884(c)(10); FY2021 § 2811.
            # [judgement: statute defines process and timelines, not a
            # resolution-rate target]
            - id: mfh_dispute_resolution_rate
              label: "Dispute Resolution Rate"
              description: "MFH disputes resolved divided by disputes filed."
              unit: ratio
              housing_category: MFH
              inputs:
                - name: resolved
                  source: record_feed
                  ref: resident_experience
                  field: disputes_resolved
                  filter: { category: MFH }
                - name: filed
                  source: record_feed
                  ref: resident_experience
                  field: disputes_filed
                  filter: { category: MFH }
              formula: { operator: ratio, numerator: resolved, denominator: filed }
              thresholds: { pass_min: 0.90, warn_min: 0.75, fail_max: 0.7499, incomplete_when_missing: true }
              freshness_days: 90
            # MFH #12 — traceability: § 2891c as amended by FY2026 § 2825.
            # [judgement, weakest thresholds in the set: FY2026 § 2825 mandates
            # disclosure only; grading absolute dollars across differently
            # sized installations is a demo convenience, flagged in dossier § 6]
            - id: mfh_dispute_payments
              label: "Dispute-Resolution Payments (USD)"
              description: "Total MFH payments made pursuant to a dispute resolution process."
              unit: USD
              housing_category: MFH
              inputs:
                - name: payments
                  source: record_feed
                  ref: resident_experience
                  field: dispute_payments_usd
                  filter: { category: MFH }
              formula: { operator: sum, value: payments }
              thresholds: { pass_max: 25000, warn_max: 100000, fail_min: 100000.01, incomplete_when_missing: true }
              freshness_days: 90

# Infra pins — dev-stack services, mirroring the shipped exemplar packs
# (food_supply_chain.yaml / medicare_fraud_cms_desynpuf.yaml) per the
# config/README first-class-pack checklist. Without these the KB store,
# records, and scorecard runs fall back to per-process in-memory defaults
# and the demo wipes on API restart.
graph:
  backend: neo4j
  uri: bolt://neo4j:7687
  pool_size: 10
  auth_env_var: null

vectorstore:
  backend: qdrant
  uri: http://qdrant:6333
  dimensions: 384
  distance_metric: cosine

embeddings:
  provider: local
  model: local-default
  dimensions: 384
  batch_size: 32
  api_key_env_var: null

storage:
  backend: local
  endpoint_url: null
  bucket: null
  base_path: /app/data/objects
  credentials_env_var: null

events:
  backend: redis
  uri: redis://redis:6379
  stream_prefix: chili
  consumer_group: chili-workers

database:
  backend: postgres
  dsn_env_var: DATABASE_URL
  pool_size: 10
  pool_max_overflow: 5
  statement_timeout_ms: 30000

analytics:
  metrics_recompute_min_interval_seconds: 300

monitoring:
  evaluation_interval_seconds: 300
  dedup_window_seconds: 3600
  max_alerts_per_entity: 10
  max_alerts_per_evaluation: 100
  grouping_window_seconds: 300

llm:
  provider: local
  model: local-default
  api_key_env_var: null
  temperature: 0.2
  max_tokens: 4096
  fallback:
    provider: openai
    model: gpt-4o-mini
    api_key_env_var: OPENAI_API_KEY
    temperature: 0.2
    max_tokens: 4096
    fallback:
      provider: ollama
      model: llama3.1:8b
      base_url: http://localhost:11434
      temperature: 0.2
      max_tokens: 4096

rag:
  top_k: 5
  expansion_depth: 2
  reranking_enabled: false
  system_prompt_template: "You are an executive housing data assistant for {domain_name}. Cite source rows and documents when answering questions about installations, UH, MFH, scorecards, and data completeness."

alerts:
  thresholds:
    installation:
      housing_health: 0.75
    housing_inventory_snapshot:
      condition_index: 70
    allowance_market_snapshot:
      affordability_index: 65

ui:
  default_entity_type: installation
  navigation:
    pages:
      - id: housing
        label: Housing
        route: /housing
        capability: risk_scoring
      - id: knowledge_bases
        label: Knowledge Bases
        route: /knowledge-bases
      - id: rag_chat
        label: Ask Housing Data
        route: /rag-chat
        capability: rag_chat
      - id: configuration
        label: Configuration
        route: /configuration
  display_fields:
    installation:
      title: name
      subtitle: majcom
      chips: [state]
    housing_asset:
      title: asset_id
      subtitle: category
      chips: [installation_id]
    housing_inventory_snapshot:
      title: snapshot_id
      subtitle: installation_id
      chips: [snapshot_date]
    population_demand_snapshot:
      title: demand_id
      subtitle: installation_id
      chips: [snapshot_date]
    allowance_market_snapshot:
      title: market_id
      subtitle: installation_id
      chips: [snapshot_date]
    demographic_snapshot:
      title: demographic_id
      subtitle: installation_id
      chips: [snapshot_date]
    resident_experience_snapshot:
      title: experience_id
      subtitle: installation_id
      chips: [snapshot_date]
    scorecard_run:
      title: run_id
      subtitle: template_id
      chips: [status]
  roles:
    executive:
      landing_page: housing
      pages: [housing, knowledge_bases, rag_chat, configuration]
      permissions: [view:housing, generate:scorecards]
    analyst:
      landing_page: housing
      pages: [housing, knowledge_bases, rag_chat]
      permissions: [view:housing]
