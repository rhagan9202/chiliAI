domain:
  name: medicare_fraud
  display_name: "Medicare Fraud Detection (CMS DE-SynPUF)"
  description: "Fraud detection for Medicare using CMS DE-SynPUF synthetic claims data"

entities:
  - name: provider
    display_label: "Provider"
    icon: stethoscope
    natural_key: [npi]
    properties:
      npi: { type: string, display: "NPI", required: true }
      entity_type_code: { type: string, display: "Entity Type Code" }       # 1=individual, 2=org
      organization_name: { type: string, display: "Organization Name" }
      last_name: { type: string, display: "Last Name" }
      first_name: { type: string, display: "First Name" }
      primary_taxonomy_code: { type: string, display: "Primary Taxonomy" }
      practice_state: { type: string, display: "Practice State" }
      practice_city: { type: string, display: "Practice City" }
      practice_postal_code: { type: string, display: "Practice Postal Code" }
      enumeration_date: { type: date, display: "Enumeration Date" }
      deactivation_date: { type: date, display: "Deactivation Date" }

  - name: beneficiary
    display_label: "Beneficiary"
    icon: person
    natural_key: [hic_number]
    properties:
      hic_number: { type: string, display: "HIC Number", required: true }
      birth_date: { type: date, display: "Date of Birth" }
      sex_code: { type: string, display: "Sex Code" }
      race_code: { type: string, display: "Race Code" }
      state_code: { type: string, display: "State Code" }

  - name: claim
    display_label: "Claim"
    icon: document
    natural_key: [claim_id]
    properties:
      claim_id: { type: string, display: "Claim ID", required: true }
      service_date: { type: date, display: "Date of Service" }
      through_date: { type: date, display: "Through Date" }
      amount: { type: decimal, display: "Payment Amount", min_value: 0 }

  - name: facility
    display_label: "Facility"
    icon: building
    natural_key: [facility_id]
    properties:
      facility_id: { type: string, display: "Facility ID", required: true }

  # ------------------------------------------------------------------
  # Document-side entity types (BL-014).
  #
  # These are extracted from the synthetic policy corpus by the document
  # ingestion path (LlmDocumentExtractor). The extractor derives its
  # extraction schema from these definitions, so they must be declared
  # for the new types to be recovered. `provider` is shared with the
  # records side, so policy->applies_to->provider joins the two graphs.
  # ------------------------------------------------------------------
  - name: policy
    display_label: "Policy"
    icon: shield
    natural_key: [policy_id]
    properties:
      policy_id: { type: string, display: "Policy ID", required: true }
      title: { type: string, display: "Title" }
      effective_date: { type: date, display: "Effective Date" }
      specialty: { type: string, display: "Specialty" }

  - name: procedure_code
    display_label: "Procedure Code"
    icon: tag
    natural_key: [code]
    properties:
      code: { type: string, display: "CPT/HCPCS Code", required: true }
      description: { type: string, display: "Description" }

  - name: regulation_section
    display_label: "Regulation Section"
    icon: book
    natural_key: [citation]
    properties:
      citation: { type: string, display: "Citation", required: true }
      title: { type: string, display: "Title" }

  - name: provider_specialty
    display_label: "Provider Specialty"
    icon: badge
    natural_key: [name]
    properties:
      name: { type: string, display: "Specialty Name", required: true }

relationships:
  - name: submitted_by
    display_label: "Submitted By"
    source: claim
    target: provider

  - name: billed_for
    display_label: "Billed For"
    source: claim
    target: beneficiary

  - name: performed_at
    display_label: "Performed At"
    source: claim
    target: facility

  - name: referred_by
    display_label: "Referred By"
    source: provider
    target: provider

  # Document-side relationships (BL-014). Extracted from the policy corpus.
  - name: governs
    display_label: "Governs"
    source: policy
    target: procedure_code

  - name: cites
    display_label: "Cites"
    source: policy
    target: regulation_section

  - name: applies_to
    display_label: "Applies To"
    source: policy
    target: provider

  - name: supersedes
    display_label: "Supersedes"
    source: policy
    target: policy

capabilities:
  timeseries: true
  gnn: true
  risk_scoring: true
  rag_chat: true
  explainability: true
  structured_ingestion: true
  peer_stats: true

ingestion:
  chunking:
    strategy: recursive
    chunk_size: 1000
    chunk_overlap: 200
    min_chunk_size: 50
  sources:
    - type: file_upload
      formats: [csv]

records:
  # analytics.34: a records batch with risk-assessable entities runs Flow B
  # (GNN → risk → explainability → alerts) natively — no external trigger.
  # Top-3 preserves the established demo narrative (same selection the
  # removed demo trigger used); one window per hour ≈ one fan-out per full
  # TN-subset ingest.
  analytics_trigger:
    enabled: true
    max_entities_per_batch: 3
    min_interval_seconds: 3600
  feeds:
    # ------------------------------------------------------------------
    # Beneficiary Summary — one row per beneficiary per calendar year.
    # Unique id: DESYNPUF_ID (16-char hex).
    # ------------------------------------------------------------------
    - name: beneficiary_2008
      record_type: beneficiary_record
      source: file_upload
      id_field: DESYNPUF_ID
      allow_extra_fields: true
      record_schema:
        DESYNPUF_ID: { type: string, display: "Beneficiary ID", required: true }
        BENE_BIRTH_DT: { type: date, display: "Birth Date" }
        BENE_DEATH_DT: { type: date, display: "Death Date" }
        BENE_SEX_IDENT_CD: { type: string, display: "Sex Code" }
        BENE_RACE_CD: { type: string, display: "Race Code" }
        SP_STATE_CODE: { type: string, display: "State Code" }
      entities:
        - entity_type: beneficiary
          id_field: DESYNPUF_ID
          property_fields:
            hic_number: DESYNPUF_ID
            birth_date: BENE_BIRTH_DT
            sex_code: BENE_SEX_IDENT_CD
            race_code: BENE_RACE_CD
            state_code: SP_STATE_CODE

    - name: beneficiary_2009
      record_type: beneficiary_record
      source: file_upload
      id_field: DESYNPUF_ID
      allow_extra_fields: true
      record_schema:
        DESYNPUF_ID: { type: string, display: "Beneficiary ID", required: true }
        BENE_BIRTH_DT: { type: date, display: "Birth Date" }
        BENE_DEATH_DT: { type: date, display: "Death Date" }
        BENE_SEX_IDENT_CD: { type: string, display: "Sex Code" }
        BENE_RACE_CD: { type: string, display: "Race Code" }
        SP_STATE_CODE: { type: string, display: "State Code" }
      entities:
        - entity_type: beneficiary
          id_field: DESYNPUF_ID
          property_fields:
            hic_number: DESYNPUF_ID
            birth_date: BENE_BIRTH_DT
            sex_code: BENE_SEX_IDENT_CD
            race_code: BENE_RACE_CD
            state_code: SP_STATE_CODE

    - name: beneficiary_2010
      record_type: beneficiary_record
      source: file_upload
      id_field: DESYNPUF_ID
      allow_extra_fields: true
      record_schema:
        DESYNPUF_ID: { type: string, display: "Beneficiary ID", required: true }
        BENE_BIRTH_DT: { type: date, display: "Birth Date" }
        BENE_DEATH_DT: { type: date, display: "Death Date" }
        BENE_SEX_IDENT_CD: { type: string, display: "Sex Code" }
        BENE_RACE_CD: { type: string, display: "Race Code" }
        SP_STATE_CODE: { type: string, display: "State Code" }
      entities:
        - entity_type: beneficiary
          id_field: DESYNPUF_ID
          property_fields:
            hic_number: DESYNPUF_ID
            birth_date: BENE_BIRTH_DT
            sex_code: BENE_SEX_IDENT_CD
            race_code: BENE_RACE_CD
            state_code: SP_STATE_CODE

    # ------------------------------------------------------------------
    # Carrier Claims — one row per claim line.
    # Unique id: CLM_ID (15-digit string).
    # Links: beneficiary via DESYNPUF_ID, provider via PRF_PHYSN_NPI_1.
    # ------------------------------------------------------------------
    - name: carrier_claims_a
      record_type: carrier_claim_record
      source: file_upload
      id_field: CLM_ID
      allow_extra_fields: true
      record_schema:
        DESYNPUF_ID: { type: string, display: "Beneficiary ID", required: true }
        CLM_ID: { type: string, display: "Claim ID", required: true }
        CLM_FROM_DT: { type: date, display: "Claim From Date" }
        CLM_THRU_DT: { type: date, display: "Claim Through Date" }
        PRF_PHYSN_NPI_1: { type: string, display: "Performing Physician NPI 1" }
        provider_specialty: { type: string, display: "Provider Specialty" }
        provider_state: { type: string, display: "Provider State" }
        service_mix: { type: string, display: "Service Mix" }
        LINE_NCH_PMT_AMT_1: { type: decimal, display: "Line Payment Amount 1", min_value: 0 }
      entities:
        - entity_type: claim
          id_field: CLM_ID
          property_fields:
            claim_id: CLM_ID
            service_date: CLM_FROM_DT
            through_date: CLM_THRU_DT
            amount: LINE_NCH_PMT_AMT_1
        - entity_type: beneficiary
          id_field: DESYNPUF_ID
          property_fields:
            hic_number: DESYNPUF_ID
        - entity_type: provider
          id_field: PRF_PHYSN_NPI_1
          property_fields:
            npi: PRF_PHYSN_NPI_1
      relationships:
        - relationship_type: billed_for
          source_entity_type: claim
          target_entity_type: beneficiary
        - relationship_type: submitted_by
          source_entity_type: claim
          target_entity_type: provider

    - name: carrier_claims_b
      record_type: carrier_claim_record
      source: file_upload
      id_field: CLM_ID
      allow_extra_fields: true
      record_schema:
        DESYNPUF_ID: { type: string, display: "Beneficiary ID", required: true }
        CLM_ID: { type: string, display: "Claim ID", required: true }
        CLM_FROM_DT: { type: date, display: "Claim From Date" }
        CLM_THRU_DT: { type: date, display: "Claim Through Date" }
        PRF_PHYSN_NPI_1: { type: string, display: "Performing Physician NPI 1" }
        provider_specialty: { type: string, display: "Provider Specialty" }
        provider_state: { type: string, display: "Provider State" }
        service_mix: { type: string, display: "Service Mix" }
        LINE_NCH_PMT_AMT_1: { type: decimal, display: "Line Payment Amount 1", min_value: 0 }
      entities:
        - entity_type: claim
          id_field: CLM_ID
          property_fields:
            claim_id: CLM_ID
            service_date: CLM_FROM_DT
            through_date: CLM_THRU_DT
            amount: LINE_NCH_PMT_AMT_1
        - entity_type: beneficiary
          id_field: DESYNPUF_ID
          property_fields:
            hic_number: DESYNPUF_ID
        - entity_type: provider
          id_field: PRF_PHYSN_NPI_1
          property_fields:
            npi: PRF_PHYSN_NPI_1
      relationships:
        - relationship_type: billed_for
          source_entity_type: claim
          target_entity_type: beneficiary
        - relationship_type: submitted_by
          source_entity_type: claim
          target_entity_type: provider

    # ------------------------------------------------------------------
    # Inpatient Claims — multiple segment rows per claim (CLM_ID not unique).
    # Composite record id: "{CLM_ID}:{SEGMENT}" ensures uniqueness in store.
    # Entity id: CLM_ID (segments of the same claim merge into one node).
    # Links: beneficiary via DESYNPUF_ID, provider via AT_PHYSN_NPI,
    #        facility via PRVDR_NUM.
    # ------------------------------------------------------------------
    - name: inpatient_claims
      record_type: inpatient_claim_record
      source: file_upload
      id_field: CLM_ID
      id_template: "{CLM_ID}:{SEGMENT}"
      allow_extra_fields: true
      record_schema:
        DESYNPUF_ID: { type: string, display: "Beneficiary ID", required: true }
        CLM_ID: { type: string, display: "Claim ID", required: true }
        SEGMENT: { type: string, display: "Segment", required: true }
        CLM_FROM_DT: { type: date, display: "Claim From Date" }
        CLM_THRU_DT: { type: date, display: "Claim Through Date" }
        PRVDR_NUM: { type: string, display: "Provider Number" }
        AT_PHYSN_NPI: { type: string, display: "Attending Physician NPI" }
        provider_specialty: { type: string, display: "Provider Specialty" }
        provider_state: { type: string, display: "Provider State" }
        service_mix: { type: string, display: "Service Mix" }
        CLM_PMT_AMT: { type: decimal, display: "Claim Payment Amount", min_value: 0 }
      entities:
        - entity_type: claim
          id_field: CLM_ID
          property_fields:
            claim_id: CLM_ID
            service_date: CLM_FROM_DT
            through_date: CLM_THRU_DT
            amount: CLM_PMT_AMT
        - entity_type: beneficiary
          id_field: DESYNPUF_ID
          property_fields:
            hic_number: DESYNPUF_ID
        - entity_type: provider
          id_field: AT_PHYSN_NPI
          property_fields:
            npi: AT_PHYSN_NPI
        - entity_type: facility
          id_field: PRVDR_NUM
          property_fields:
            facility_id: PRVDR_NUM
      relationships:
        - relationship_type: billed_for
          source_entity_type: claim
          target_entity_type: beneficiary
        - relationship_type: submitted_by
          source_entity_type: claim
          target_entity_type: provider
        - relationship_type: performed_at
          source_entity_type: claim
          target_entity_type: facility

    # ------------------------------------------------------------------
    # Outpatient Claims — same segment pattern as inpatient.
    # Links: beneficiary via DESYNPUF_ID, provider via AT_PHYSN_NPI,
    #        facility via PRVDR_NUM.
    # ------------------------------------------------------------------
    - name: outpatient_claims
      record_type: outpatient_claim_record
      source: file_upload
      id_field: CLM_ID
      id_template: "{CLM_ID}:{SEGMENT}"
      allow_extra_fields: true
      record_schema:
        DESYNPUF_ID: { type: string, display: "Beneficiary ID", required: true }
        CLM_ID: { type: string, display: "Claim ID", required: true }
        SEGMENT: { type: string, display: "Segment", required: true }
        CLM_FROM_DT: { type: date, display: "Claim From Date" }
        CLM_THRU_DT: { type: date, display: "Claim Through Date" }
        PRVDR_NUM: { type: string, display: "Provider Number" }
        AT_PHYSN_NPI: { type: string, display: "Attending Physician NPI" }
        CLM_PMT_AMT: { type: decimal, display: "Claim Payment Amount", min_value: 0 }
      entities:
        - entity_type: claim
          id_field: CLM_ID
          property_fields:
            claim_id: CLM_ID
            service_date: CLM_FROM_DT
            through_date: CLM_THRU_DT
            amount: CLM_PMT_AMT
        - entity_type: beneficiary
          id_field: DESYNPUF_ID
          property_fields:
            hic_number: DESYNPUF_ID
        - entity_type: provider
          id_field: AT_PHYSN_NPI
          property_fields:
            npi: AT_PHYSN_NPI
        - entity_type: facility
          id_field: PRVDR_NUM
          property_fields:
            facility_id: PRVDR_NUM
      relationships:
        - relationship_type: billed_for
          source_entity_type: claim
          target_entity_type: beneficiary
        - relationship_type: submitted_by
          source_entity_type: claim
          target_entity_type: provider
        - relationship_type: performed_at
          source_entity_type: claim
          target_entity_type: facility

    # ------------------------------------------------------------------
    # Prescription Drug Events — one row per dispensing event.
    # Unique id: PDE_ID (15-digit string).
    # Links: beneficiary via DESYNPUF_ID.
    # ------------------------------------------------------------------
    - name: pde
      record_type: pde_record
      source: file_upload
      id_field: PDE_ID
      allow_extra_fields: true
      record_schema:
        DESYNPUF_ID: { type: string, display: "Beneficiary ID", required: true }
        PDE_ID: { type: string, display: "PDE ID", required: true }
        SRVC_DT: { type: date, display: "Service Date" }
        PROD_SRVC_ID: { type: string, display: "Product Service ID" }
        QTY_DSPNSD_NUM: { type: decimal, display: "Quantity Dispensed", min_value: 0 }
        DAYS_SUPLY_NUM: { type: integer, display: "Days Supply", min_value: 0 }
        PTNT_PAY_AMT: { type: decimal, display: "Patient Pay Amount", min_value: 0 }
        TOT_RX_CST_AMT: { type: decimal, display: "Total Rx Cost", min_value: 0 }
      entities:
        - entity_type: claim
          id_field: PDE_ID
          property_fields:
            claim_id: PDE_ID
            service_date: SRVC_DT
            amount: TOT_RX_CST_AMT
        - entity_type: beneficiary
          id_field: DESYNPUF_ID
          property_fields:
            hic_number: DESYNPUF_ID
      relationships:
        - relationship_type: billed_for
          source_entity_type: claim
          target_entity_type: beneficiary

    # ------------------------------------------------------------------
    # NPPES NPI Registry — one row per provider.
    # Source: tools/sample_data/build_tennessee_subset.py output
    # (nppes_providers_tn.csv).
    # ------------------------------------------------------------------
    - name: nppes_providers
      record_type: provider_record
      source: file_upload
      id_field: NPI
      allow_extra_fields: true
      record_schema:
        NPI: { type: string, display: "NPI", required: true }
        Entity Type Code: { type: string, display: "Entity Type Code" }
        Provider Organization Name (Legal Business Name): { type: string, display: "Organization Name" }
        Provider Last Name (Legal Name): { type: string, display: "Last Name" }
        Provider First Name: { type: string, display: "First Name" }
        Healthcare Provider Taxonomy Code_1: { type: string, display: "Primary Taxonomy" }
        Provider Business Practice Location Address State Name: { type: string, display: "Practice State" }
        Provider Business Practice Location Address City Name: { type: string, display: "Practice City" }
        Provider Business Practice Location Address Postal Code: { type: string, display: "Practice Postal Code" }
        Provider Enumeration Date: { type: date, display: "Enumeration Date" }
        NPI Deactivation Date: { type: date, display: "Deactivation Date" }
      entities:
        - entity_type: provider
          id_field: NPI
          property_fields:
            npi: NPI
            entity_type_code: "Entity Type Code"
            organization_name: "Provider Organization Name (Legal Business Name)"
            last_name: "Provider Last Name (Legal Name)"
            first_name: "Provider First Name"
            primary_taxonomy_code: "Healthcare Provider Taxonomy Code_1"
            practice_state: "Provider Business Practice Location Address State Name"
            practice_city: "Provider Business Practice Location Address City Name"
            practice_postal_code: "Provider Business Practice Location Address Postal Code"
            enumeration_date: "Provider Enumeration Date"
            deactivation_date: "NPI Deactivation Date"

peer_stats:
  metrics:
    - name: weekly_carrier_billing
      record_type: carrier_claim_record
      entity_type: provider
      entity_id_field: PRF_PHYSN_NPI_1
      value_column: LINE_NCH_PMT_AMT_1
      aggregation: sum
      interval: week
      time_column: CLM_FROM_DT
      direction: high
      z_cap: 4.0
      weight: 1.5
      min_peers: 5
    - name: monthly_inpatient_billing
      record_type: inpatient_claim_record
      entity_type: provider
      entity_id_field: AT_PHYSN_NPI
      value_column: CLM_PMT_AMT
      aggregation: sum
      interval: month
      time_column: CLM_FROM_DT
      direction: high
      z_cap: 4.0
      weight: 1.5
      min_peers: 5
  cohorts:
    - id: provider_specialty_carrier_billing
      label: "Provider specialty carrier billing peers"
      entity_type: provider
      peer_metric: weekly_carrier_billing
      group_by: [provider_specialty]
      min_cohort_size: 5
      version: v1
    - id: provider_geography_carrier_billing
      label: "Provider geography carrier billing peers"
      entity_type: provider
      peer_metric: weekly_carrier_billing
      group_by: [provider_state]
      min_cohort_size: 5
      version: v1
    - id: provider_service_mix_inpatient_billing
      label: "Provider service-mix inpatient billing peers"
      entity_type: provider
      peer_metric: monthly_inpatient_billing
      group_by: [service_mix]
      min_cohort_size: 5
      version: v1

timeseries:
  metrics:
    - name: weekly_carrier_billing_self
      record_type: carrier_claim_record
      entity_type: provider
      entity_id_field: PRF_PHYSN_NPI_1
      value_column: LINE_NCH_PMT_AMT_1
      aggregation: sum
      interval: week
      time_column: CLM_FROM_DT
      detection_strategy: z_score
      baseline_window: 4
      min_history: 6
      z_threshold: 2.5
      z_cap: 4.0
      signal_weight: 1.0
    - name: monthly_inpatient_billing_self
      record_type: inpatient_claim_record
      entity_type: provider
      entity_id_field: AT_PHYSN_NPI
      value_column: CLM_PMT_AMT
      aggregation: sum
      interval: month
      time_column: CLM_FROM_DT
      detection_strategy: z_score
      baseline_window: 3
      min_history: 5
      z_threshold: 2.5
      z_cap: 4.0
      signal_weight: 1.0

# ---------------------------------------------------------------------------
# Policy Intelligence rule packs (BL-011).
#
# The worker evaluates these against ingested data and generates durable,
# KB-scoped policy items. These are demo-tuned so a plain `make dev` + ingest
# of the TN DE-SynPUF subset produces live items without any code or
# CHILI_CONFIG_PATH change. See docs/adding_rulesets.md for how this works and
# how to author your own packs.
# ---------------------------------------------------------------------------
policy_rules:
  # Entity-target rule: flags individual claims whose Medicare payment amount
  # is high enough to warrant analyst review. `properties.amount` is the claim
  # entity's payment-amount property (mapped from LINE_NCH_PMT_AMT_1 /
  # CLM_PMT_AMT / TOT_RX_CST_AMT across the claim feeds). The threshold is set
  # low for the demo; raise `min_elevated_amount` for production screening.
  - id: elevated_payment_claims
    name: "Elevated payment claims"
    description: "Claims whose Medicare payment exceeds the analyst-review threshold."
    thresholds:
      min_elevated_amount: 500
    rules:
      - id: claim_elevated_payment
        title_template: "Claim {target_ref} payment exceeds the elevated-review threshold"
        severity: high
        target_kind: entity
        target_selector:
          entity_type: claim
        predicate:
          field: properties.amount
          op: gt
          value:
            config_ref: min_elevated_amount
        citations:
          - citation_id: cms-pim-ch3
            title: "CMS Program Integrity Manual, Ch. 3 — claims review"
            source_ref: "policy://cms/pim/chapter-3"
            excerpt: "High-dollar claims are prioritized for medical-review screening."

  # Metric-target rule: surfaces one review item per KB once the graph grows
  # past a watch line, demonstrating the `metric` target kind. `entity_count`
  # is supplied by the worker from graph metrics. Reliably fires after the TN
  # subset is ingested (which lands well over 50 entities).
  - id: graph_scale_watch
    name: "Graph growth watch"
    description: "Surfaces a periodic integrity-sweep item once a KB accumulates many entities."
    thresholds:
      max_entities: 50
    rules:
      - id: kb_entity_volume
        title_template: "Knowledge base {target_ref} crossed the entity-volume watch line"
        severity: medium
        target_kind: metric
        target_selector:
          metric_name: entity_count
        predicate:
          field: metric.entity_count
          op: gt
          value:
            config_ref: max_entities

  # Entity-target rule: flags providers whose composite risk score crosses the
  # analyst-review line — the demo's UPCODING/billing-concentration pattern.
  # Risk composites are produced by the peer-deviation + self-history anomaly
  # signals and land on `risk_score`. DEMO-tuned: live TN data showed provider
  # risk composites ~0.33-0.42 (B2/B3 passes), so 0.35 fires for the top
  # providers; raise for production screening.
  - id: outlier_billing_concentration
    name: "Outlier billing concentration"
    description: >-
      Providers whose composite risk score crosses the analyst-review line —
      the demo's UPCODING/billing-concentration pattern. Risk composites are
      produced by the peer-deviation + self-history anomaly signals.
    thresholds:
      review_risk_score: 0.35
    rules:
      - id: provider_outlier_billing
        title_template: "Provider {target_ref} shows outlier billing concentration"
        severity: high
        target_kind: entity
        target_selector:
          entity_type: provider
        predicate:
          field: risk_score
          op: gte
          value:
            config_ref: review_risk_score
        citations:
          - citation_id: cms-pim-ch4-billing
            title: "CMS Program Integrity Manual, Ch. 4 — provider billing review"
            source_ref: "policy://cms/pim/chapter-4"
            excerpt: "Providers with billing patterns materially above peer benchmarks are prioritized for prepayment review."

  # Entity-target rule: flags providers repeatedly flagged by the analytics
  # pipeline — the demo's referral-ring proxy. `properties.active_alert_count`
  # is the count Flow 4 (handle_alerts_created_for_graph) snapshots onto graph
  # entities from open alerts, so it accumulates across detection runs.
  # DEMO-tuned: active_alert_count reached 2-3 on re-analyzed providers
  # (alerts.36 pass), so 2 fires after two Flow B runs.
  - id: referral_ring_exposure
    name: "Referral-ring exposure"
    description: >-
      Providers repeatedly flagged by the analytics pipeline — the demo's
      referral-ring proxy: graph write-back marks entities whose alert count
      accumulates across detection runs.
    thresholds:
      repeat_flag_count: 2
    rules:
      - id: provider_repeat_flag_exposure
        title_template: "Provider {target_ref} carries repeated analytic flags"
        severity: critical
        target_kind: entity
        target_selector:
          entity_type: provider
        predicate:
          field: properties.active_alert_count
          op: gte
          value:
            config_ref: repeat_flag_count
        citations:
          - citation_id: cms-pim-ch2-network
            title: "CMS Program Integrity Manual, Ch. 2 — coordinated scheme indicators"
            source_ref: "policy://cms/pim/chapter-2"
            excerpt: "Recurring anomalies concentrated on connected providers indicate potential coordinated schemes."

graph:
  backend: neo4j
  uri: bolt://neo4j:7687
  pool_size: 10
  auth_env_var: null

vectorstore:
  backend: qdrant
  uri: http://qdrant:6333
  dimensions: 384
  distance_metric: cosine

embeddings:
  provider: local
  model: local-default
  dimensions: 384
  batch_size: 32
  api_key_env_var: null

storage:
  backend: local
  endpoint_url: null
  bucket: null
  base_path: /app/data/objects
  credentials_env_var: null

events:
  backend: redis
  uri: redis://redis:6379
  stream_prefix: chili
  consumer_group: chili-workers

database:
  backend: postgres
  dsn_env_var: DATABASE_URL
  pool_size: 10
  pool_max_overflow: 5
  statement_timeout_ms: 30000

analytics:
  # DE-SynPUF's two peer metrics read *different* claim files via different NPI
  # columns: weekly_carrier_billing uses PRF_PHYSN_NPI_1 from carrier claims,
  # monthly_inpatient_billing uses AT_PHYSN_NPI from inpatient claims. In the TN
  # subset only 147 of 32,948 carrier providers also appear in the inpatient
  # file, so a floor of 2 leaves ~99.6% of providers permanently unscoreable —
  # which is why risk_score_history was empty. One signal is the honest floor
  # for this data; medicare_fraud.yaml keeps 2, since both of its metrics read
  # the same records via the same id field and always fire together.
  min_risk_signals: 1
  metrics_recompute_min_interval_seconds: 300
  narrative_backend: llm
  attribution_backend: shap

monitoring:
  evaluation_interval_seconds: 300
  dedup_window_seconds: 3600
  max_alerts_per_entity: 10
  max_alerts_per_evaluation: 100
  grouping_window_seconds: 300

llm:
  provider: local
  model: local-default
  api_key_env_var: null
  temperature: 0.2
  max_tokens: 4096
  fallback:
    provider: openai
    model: gpt-4o-mini
    api_key_env_var: OPENAI_API_KEY
    temperature: 0.2
    max_tokens: 4096
    fallback:
      provider: ollama
      model: llama3.1:8b
      base_url: http://localhost:11434
      temperature: 0.2
      max_tokens: 4096

rag:
  top_k: 5
  expansion_depth: 2
  reranking_enabled: false
  system_prompt_template: "You are an expert assistant for {domain_name}. Use the provided context to answer questions about {entity_types}."

alerts:
  thresholds:
    provider:
      risk_score: 0.75
      anomaly_sigma: 2.5
    beneficiary:
      risk_score: 0.80
    claim:
      amount_percentile: 99

# --- SAFE-CMS-001 fraud typology / feature / playbook layer -------------------
# Ported from the generic `medicare_fraud` exemplar on 2026-08-06 so that the
# pack every deployment actually loads carries this layer. Previously it lived
# only in `medicare_fraud.yaml`, which no compose file, .env.example or
# `make demo-cms` selects — so typologies, feature values and playbooks were
# dark in dev, docker-prod and the demo, while infra/k8s/configmap.yaml pointed
# at the exemplar and therefore behaved differently.
#
# Every reference below resolves against THIS pack's feeds, peer metrics,
# timeseries metrics and policy rules. Three exemplar features had no DE-SynPUF
# source at all and were replaced rather than copied with dead lineage:
#   procedure-code density -> repeated_product_code_density   (records.pde)
#   DMEPOS code exposure   -> drug_supply_overutilization     (records.pde)
#   upstream anomaly score -> claim_payment_amount_exposure   (carrier claims)
# No DE-SynPUF feed carries procedure or diagnosis codes, none declares an
# observations block, and there is no durable-medical-equipment surface; the
# `dmepos_overutilization` typology is retained but is backed by Part D
# overutilization signals rather than DME codes.
#
# `weekly_provider_claim_count_zscore` became `monthly_inpatient_billing_zscore`:
# DE-SynPUF exposes no claim-count peer metric.
typologies:
- id: dmepos_overutilization
  label: Supply overutilization
  description: Provider, claim, or beneficiary patterns indicating unusually dense supply
    billing. Under DE-SynPUF this is evidenced by Part D drug overutilization — days
    supply, dispensed quantity and repeat product codes — not durable medical equipment,
    because the dataset carries no DMEPOS or procedure codes. The id is kept for continuity
    with the CMS typology taxonomy; the label reflects what the data can actually support.
  entity_types:
  - provider
  - claim
  - beneficiary
  severity_hint: high
  feature_ids:
  - drug_supply_overutilization
  - beneficiary_high_utilization_count
  - repeated_product_code_density
  - monthly_inpatient_billing_zscore
- id: billing_spike
  label: Billing spike
  description: Provider billing volume or amount increased beyond peer and historical norms.
  entity_types:
  - provider
  - claim
  severity_hint: high
  playbook_ids:
  - provider_billing_spike_review
  feature_ids:
  - weekly_provider_billing_zscore
  - monthly_inpatient_billing_zscore
  - service_date_burstiness
  - claim_payment_amount_exposure
  policy_rule_ids:
  - elevated_payment_claims.claim_elevated_payment
- id: peer_outlier
  label: Peer outlier
  description: Provider or facility behavior sits outside expected specialty or facility peer groups.
  entity_types:
  - provider
  - facility
  severity_hint: medium
  playbook_ids:
  - peer_outlier_provider_review
  feature_ids:
  - specialty_peer_group_outlier
  - facility_concentration_ratio
  - weekly_provider_billing_zscore
  policy_rule_ids:
  - outlier_billing_concentration.provider_outlier_billing
- id: referral_ring_exposure
  label: Referral ring exposure
  description: Referral graph structure suggests concentrated or reciprocal provider activity.
  entity_types:
  - provider
  - beneficiary
  severity_hint: high
  feature_ids:
  - provider_referral_outdegree
  - provider_referral_indegree
  - shared_beneficiary_density
  policy_rule_ids:
  - referral_ring_exposure.provider_repeat_flag_exposure
- id: geographic_anomaly
  label: Geographic anomaly
  description: Billing or service patterns are unusual for the provider state or service geography.
  entity_types:
  - provider
  - claim
  - facility
  severity_hint: medium
  feature_ids:
  - geographic_state_outlier
  - facility_concentration_ratio
  - service_date_burstiness
- id: enrollment_risk
  label: Enrollment risk
  description: Provider enrollment recency or age patterns elevate fraud-screening concern.
  entity_types:
  - provider
  severity_hint: medium
  feature_ids:
  - enrollment_age_risk
  - specialty_peer_group_outlier
  - evidence_pack_confidence
- id: never_provided_service
  label: Never provided service
  description: Evidence indicates a billed service was not provided or lacks supporting documentation.
  entity_types:
  - claim
  - provider
  - beneficiary
  severity_hint: critical
  feature_ids:
  - never_provided_service_signal
  - cross_kb_policy_citation_count
  - evidence_pack_confidence
- id: policy_threshold_exposure
  label: Policy threshold exposure
  description: Claim or provider activity triggers configured CMS policy thresholds.
  entity_types:
  - claim
  - provider
  severity_hint: high
  feature_ids:
  - claim_amount_threshold_exposure
  - policy_billing_threshold_hits
  - cross_kb_policy_citation_count
  policy_rule_ids:
  - elevated_payment_claims.claim_elevated_payment
- id: identity_mismatch
  label: Identity mismatch
  description: Source identity links need analyst review before the canonical entity can be trusted.
  entity_types:
  - provider
  - beneficiary
  severity_hint: medium
  playbook_ids:
  - identity_mismatch_review
  feature_ids:
  - identity_link_confidence

playbooks:
  version: cms-playbooks-v1
  items:
  - id: provider_billing_spike_review
    version: v1
    title: Provider billing spike review
    summary: Review provider billing acceleration against baseline, peers, policy, and supporting records.
    status: draft
    typology_ids:
    - billing_spike
    feature_ids:
    - weekly_provider_billing_zscore
    - monthly_inpatient_billing_zscore
    - claim_payment_amount_exposure
    policy_rule_ids:
    - elevated_payment_claims.claim_elevated_payment
    evidence_requirements:
    - id: risk_projection
      label: Risk projection
      description: Current risk score, score age, and top contributing features.
      source_types:
      - risk_projection
      - feature_value
      required: true
    - id: peer_context
      label: Peer context
      description: Peer cohort distribution and z-score summary.
      source_types:
      - peer_analysis
      required: true
    workflow_steps:
    - id: review_risk_projection
      label: Review risk projection
      capability_ref: analytics.risk_projection.read
      input_refs:
      - knowledge_base_id
      - entity_id
      output_refs:
      - risk_summary
      requires_human_approval: false
    - id: verify_policy_threshold
      label: Verify policy threshold context
      capability_ref: policy.rules.read
      input_refs:
      - knowledge_base_id
      - entity_id
      - policy_rule_id
      output_refs:
      - policy_context
      requires_human_approval: false
    rag_prompts:
    - id: billing_spike_context
      model_ref: default
      prompt_version: v1
      system_prompt: Answer with cited evidence only.
      user_prompt: Summarize the billing spike evidence for {entity_id}.
    decision_guidance:
    - Open or attach a case when billing acceleration is corroborated by source records and peer context.
    - Record whether the policy threshold was triggered by claim amount or accumulated billing behavior.
    export_tags:
    - cms
    - billing
    - provider
  - id: peer_outlier_provider_review
    version: v1
    title: Peer outlier provider review
    summary: Review provider behavior against configured specialty and geography peer cohorts.
    status: draft
    typology_ids:
    - peer_outlier
    feature_ids:
    - specialty_peer_group_outlier
    - weekly_provider_billing_zscore
    - facility_concentration_ratio
    policy_rule_ids: []
    evidence_requirements:
    - id: peer_distribution
      label: Peer distribution
      description: Cohort membership, distribution, entity value, z-score, and percentile.
      source_types:
      - peer_analysis
      required: true
    - id: facility_context
      label: Facility context
      description: Facility concentration and related claim activity.
      source_types:
      - graph_metric
      - feature_value
      required: false
    workflow_steps:
    - id: gather_peer_context
      label: Gather peer context
      capability_ref: analytics.peer_analysis.read
      input_refs:
      - knowledge_base_id
      - entity_id
      output_refs:
      - peer_summary
      requires_human_approval: false
    rag_prompts:
    - id: peer_outlier_context
      model_ref: default
      prompt_version: v1
      system_prompt: Answer with cited evidence only.
      user_prompt: Explain why {entity_id} is an outlier compared with peers.
    decision_guidance:
    - Escalate only when the peer cohort is large enough and supporting evidence is available.
    - Compare peer outlier evidence with facility and claim context before assigning severity.
    export_tags:
    - cms
    - peer
    - provider
  - id: identity_mismatch_review
    version: v1
    title: Identity mismatch review
    summary: Review source identities and merge or split history before relying on the canonical entity.
    status: draft
    typology_ids:
    - identity_mismatch
    feature_ids:
    - identity_link_confidence
    policy_rule_ids: []
    evidence_requirements:
    - id: identity_links
      label: Identity links
      description: Canonical and source identity links with confidence and review state.
      source_types:
      - identity_link
      required: true
    workflow_steps:
    - id: inspect_identity_links
      label: Inspect identity links
      capability_ref: identity.canonical.read
      input_refs:
      - knowledge_base_id
      - entity_id
      output_refs:
      - identity_summary
      requires_human_approval: false
    rag_prompts:
    - id: identity_context
      model_ref: default
      prompt_version: v1
      system_prompt: Answer with cited evidence only.
      user_prompt: Summarize identity-link evidence and unresolved review states for {entity_id}.
    decision_guidance:
    - Do not treat a low-confidence identity merge as decisive until a steward review is complete.
    - Preserve source identity evidence when opening or updating the case.
    export_tags:
    - cms
    - identity

feature_catalog:
  version: cms-desynpuf-features-v1
  features:
  - id: weekly_provider_billing_zscore
    label: Weekly provider billing z-score
    description: Peer-normalized weekly billed amount for a provider.
    value_type: decimal
    entity_types:
    - provider
    source_mappings:
    - source_type: peer_metric
      source_ref: peer_stats.weekly_carrier_billing
      raw_fields:
      - LINE_NCH_PMT_AMT_1
      - CLM_FROM_DT
      - PRF_PHYSN_NPI_1
    peer_dimensions:
    - provider
    threshold_hints:
      high: 2.0
      critical: 3.0
    transformation_version: peerstats-zscore-v1
    typology_ids:
    - billing_spike
    - peer_outlier
  - id: monthly_inpatient_billing_zscore
    label: Monthly inpatient billing z-score
    description: Peer-normalized monthly inpatient paid amount for a provider. DE-SynPUF exposes no claim-count
      peer metric, so magnitude on the inpatient feed replaces the exemplar's claim-count signal.
    value_type: decimal
    entity_types:
    - provider
    source_mappings:
    - source_type: peer_metric
      source_ref: peer_stats.monthly_inpatient_billing
      raw_fields:
      - CLM_PMT_AMT
      - CLM_FROM_DT
      - AT_PHYSN_NPI
    peer_dimensions:
    - provider
    threshold_hints:
      high: 2.0
      critical: 3.0
    transformation_version: peerstats-zscore-v1
    typology_ids:
    - dmepos_overutilization
    - billing_spike
  - id: claim_amount_threshold_exposure
    label: Claim amount threshold exposure
    description: Claim billed amount compared with the configured policy threshold.
    value_type: decimal
    entity_types:
    - claim
    source_mappings:
    - source_type: policy_rule
      source_ref: policy_rules.elevated_payment_claims.claim_elevated_payment
      raw_fields:
      - claim_id
      - billed_amount
    threshold_hints:
      high: 5000.0
    transformation_version: policy-threshold-v1
    typology_ids:
    - policy_threshold_exposure
  - id: claim_payment_amount_exposure
    label: Claim payment amount exposure
    description: Paid amount on a carrier claim line, used as the claim-level magnitude signal. DE-SynPUF
      feeds declare no observations block, so there is no upstream anomaly score to normalize.
    value_type: decimal
    entity_types:
    - claim
    source_mappings:
    - source_type: records_feed
      source_ref: records.carrier_claims_a.LINE_NCH_PMT_AMT_1
      raw_fields:
      - CLM_ID
      - LINE_NCH_PMT_AMT_1
      - CLM_FROM_DT
    threshold_hints:
      high: 0.75
      critical: 0.9
    transformation_version: claim-amount-exposure-v1
    typology_ids:
    - billing_spike
  - id: provider_referral_outdegree
    label: Provider referral outdegree
    description: Count of outgoing provider-to-provider referral relationships.
    value_type: integer
    entity_types:
    - provider
    source_mappings:
    - source_type: graph_metric
      source_ref: relationships.referred_by.outdegree
      raw_fields:
      - source_provider_npi
      - target_provider_npi
    threshold_hints:
      high: 20.0
      critical: 50.0
    transformation_version: graph-degree-v1
    typology_ids:
    - referral_ring_exposure
  - id: provider_referral_indegree
    label: Provider referral indegree
    description: Count of incoming provider-to-provider referral relationships.
    value_type: integer
    entity_types:
    - provider
    source_mappings:
    - source_type: graph_metric
      source_ref: relationships.referred_by.indegree
      raw_fields:
      - source_provider_npi
      - target_provider_npi
    threshold_hints:
      high: 20.0
      critical: 50.0
    transformation_version: graph-degree-v1
    typology_ids:
    - referral_ring_exposure
  - id: shared_beneficiary_density
    label: Shared beneficiary density
    description: Density of beneficiaries shared across connected providers.
    value_type: decimal
    entity_types:
    - provider
    - beneficiary
    source_mappings:
    - source_type: graph_metric
      source_ref: relationships.billed_for.shared_beneficiaries
      raw_fields:
      - provider_npi
      - hic_number
      - claim_id
    threshold_hints:
      high: 0.4
      critical: 0.65
    transformation_version: shared-beneficiary-density-v1
    typology_ids:
    - referral_ring_exposure
  - id: geographic_state_outlier
    label: Geographic state outlier
    description: Provider or claim behavior outside expected state-level patterns.
    value_type: decimal
    entity_types:
    - provider
    - claim
    - facility
    source_mappings:
    - source_type: derived_signal
      source_ref: entity_derived_signals.geographic_state_outlier
      raw_fields:
      - state
      - claim_id
      - facility_id
    peer_dimensions:
    - state
    threshold_hints:
      high: 2.0
      critical: 3.0
    transformation_version: geo-outlier-v1
    typology_ids:
    - geographic_anomaly
  - id: specialty_peer_group_outlier
    label: Specialty peer group outlier
    description: Provider score relative to peers in the same specialty.
    value_type: decimal
    entity_types:
    - provider
    source_mappings:
    - source_type: derived_signal
      source_ref: entity_derived_signals.specialty_peer_group_outlier
      raw_fields:
      - provider_npi
      - specialty
      - billed_amount
    peer_dimensions:
    - specialty
    threshold_hints:
      high: 2.0
      critical: 3.0
    transformation_version: specialty-peer-v1
    typology_ids:
    - peer_outlier
    - enrollment_risk
  - id: beneficiary_chronic_condition_complexity
    label: Beneficiary chronic condition complexity
    description: Count or normalized complexity of beneficiary chronic conditions.
    value_type: decimal
    entity_types:
    - beneficiary
    source_mappings:
    - source_type: records_feed
      source_ref: entities.beneficiary.properties.chronic_conditions
      raw_fields:
      - hic_number
      - chronic_conditions
    threshold_hints:
      high: 6.0
      critical: 10.0
    transformation_version: chronic-condition-complexity-v1
    typology_ids:
    - dmepos_overutilization
  - id: beneficiary_high_utilization_count
    label: Beneficiary high-utilization count
    description: Count of high-utilization claim events associated with a beneficiary.
    value_type: integer
    entity_types:
    - beneficiary
    source_mappings:
    - source_type: graph_metric
      source_ref: relationships.billed_for.claim_count
      raw_fields:
      - hic_number
      - claim_id
      - service_date
    threshold_hints:
      high: 12.0
      critical: 24.0
    transformation_version: beneficiary-utilization-v1
    typology_ids:
    - dmepos_overutilization
  - id: facility_concentration_ratio
    label: Facility concentration ratio
    description: Share of provider or claim activity concentrated at a facility.
    value_type: decimal
    entity_types:
    - facility
    - provider
    - claim
    source_mappings:
    - source_type: graph_metric
      source_ref: relationships.performed_at.concentration
      raw_fields:
      - facility_id
      - provider_npi
      - claim_id
    threshold_hints:
      high: 0.5
      critical: 0.8
    transformation_version: facility-concentration-v1
    typology_ids:
    - peer_outlier
    - geographic_anomaly
  - id: repeated_product_code_density
    label: Repeated product-code density
    description: 'Density of repeated dispensed product/service codes for a beneficiary or prescriber,
      from the Part D event feed. Replaces the exemplar''s procedure-code density: no DE-SynPUF feed carries
      procedure or diagnosis codes.'
    value_type: decimal
    entity_types:
    - provider
    - beneficiary
    source_mappings:
    - source_type: records_feed
      source_ref: records.pde.PROD_SRVC_ID
      raw_fields:
      - PDE_ID
      - PROD_SRVC_ID
      - DESYNPUF_ID
      - SRVC_DT
    threshold_hints:
      high: 0.35
      critical: 0.6
    transformation_version: product-code-density-v1
    typology_ids:
    - dmepos_overutilization
  - id: service_date_burstiness
    label: Service-date burstiness
    description: Concentration of services in short date windows.
    value_type: decimal
    entity_types:
    - provider
    - claim
    source_mappings:
    - source_type: timeseries_metric
      source_ref: timeseries.weekly_carrier_billing_self
      raw_fields:
      - CLM_FROM_DT
      - PRF_PHYSN_NPI_1
      - LINE_NCH_PMT_AMT_1
    threshold_hints:
      high: 2.0
      critical: 3.0
    transformation_version: service-date-burst-v1
    typology_ids:
    - billing_spike
    - geographic_anomaly
  - id: policy_billing_threshold_hits
    label: Policy billing threshold hits
    description: Count of claims matching configured billing threshold rules.
    value_type: integer
    entity_types:
    - claim
    - provider
    source_mappings:
    - source_type: policy_rule
      source_ref: policy_rules.elevated_payment_claims
      raw_fields:
      - claim_id
      - billed_amount
    threshold_hints:
      high: 1.0
      critical: 3.0
    transformation_version: policy-hit-count-v1
    typology_ids:
    - policy_threshold_exposure
  - id: enrollment_age_risk
    label: Enrollment age risk
    description: Risk signal based on provider enrollment age or recency.
    value_type: decimal
    entity_types:
    - provider
    source_mappings:
    - source_type: derived_signal
      source_ref: entity_derived_signals.enrollment_age_risk
      raw_fields:
      - provider_npi
      - enrollment_date
    threshold_hints:
      high: 0.7
      critical: 0.9
    transformation_version: enrollment-age-v1
    typology_ids:
    - enrollment_risk
  - id: never_provided_service_signal
    label: Never-provided service signal
    description: Evidence-backed indicator that a billed service was not provided.
    value_type: boolean
    entity_types:
    - claim
    - provider
    - beneficiary
    source_mappings:
    - source_type: evidence_pack
      source_ref: evidence.never_provided_service
      raw_fields:
      - claim_id
      - provider_npi
      - hic_number
    threshold_hints:
      high: 1.0
      critical: 1.0
    transformation_version: never-provided-service-v1
    typology_ids:
    - never_provided_service
  - id: drug_supply_overutilization
    label: Drug supply overutilization
    description: 'Days-supply and dispensed-quantity outlier relative to peers, weighted by total drug
      cost. Replaces the exemplar''s DMEPOS code exposure: DE-SynPUF has no durable-medical-equipment
      surface, so Part D overutilization is the closest real analogue.'
    value_type: decimal
    entity_types:
    - provider
    - beneficiary
    source_mappings:
    - source_type: records_feed
      source_ref: records.pde.DAYS_SUPLY_NUM
      raw_fields:
      - PDE_ID
      - DAYS_SUPLY_NUM
      - QTY_DSPNSD_NUM
      - TOT_RX_CST_AMT
      - DESYNPUF_ID
    threshold_hints:
      high: 0.4
      critical: 0.7
    transformation_version: drug-supply-overutilization-v1
    typology_ids:
    - dmepos_overutilization
  - id: cross_kb_policy_citation_count
    label: Cross-KB policy citation count
    description: Count of relevant policy citations found across attached knowledge bases.
    value_type: integer
    entity_types:
    - claim
    - provider
    source_mappings:
    - source_type: rag_evidence
      source_ref: knowledgebases.policy_graph.citations
      raw_fields:
      - claim_id
      - provider_npi
      - citation_id
    threshold_hints:
      high: 2.0
      critical: 5.0
    transformation_version: cross-kb-citation-v1
    typology_ids:
    - never_provided_service
    - policy_threshold_exposure
  - id: evidence_pack_confidence
    label: Evidence pack confidence
    description: Normalized confidence score for the assembled investigator evidence pack.
    value_type: decimal
    entity_types:
    - provider
    - claim
    source_mappings:
    - source_type: evidence_pack
      source_ref: evidence.packs.confidence
      raw_fields:
      - entity_id
      - claim_id
      - citation_id
    threshold_hints:
      high: 0.75
      critical: 0.9
    transformation_version: evidence-pack-confidence-v1
    typology_ids:
    - enrollment_risk
    - never_provided_service
  - id: identity_link_confidence
    label: Identity link confidence
    description: Confidence and review status for source-to-canonical identity links.
    value_type: decimal
    entity_types:
    - provider
    - beneficiary
    source_mappings:
    - source_type: identity_link
      source_ref: identity.links.confidence
      raw_fields:
      - entity_id
      - canonical_entity_id
      - review_state
    threshold_hints:
      high: 0.65
      critical: 0.35
    transformation_version: identity-link-v1
    typology_ids:
    - identity_mismatch

ui:
  default_entity_type: provider
  navigation:
    pages:
      - id: dashboard
        label: Dashboard
        route: /dashboard
        capability: risk_scoring
      - id: alerts
        label: Alert Feed
        route: /alerts
      - id: investigation
        label: Investigation Workbench
        route: /investigation
        capability: gnn
      - id: cases
        label: Case Management
        route: /cases
      - id: knowledge_bases
        label: Knowledge Bases
        route: /knowledge-bases
      - id: policy
        label: Policy Intelligence
        route: /policy
        capability: explainability
      - id: governance
        label: Governance
        route: /governance
        capability: explainability
      - id: rag_chat
        label: RAG Chat
        route: /rag-chat
        capability: rag_chat
      - id: configuration
        label: Configuration
        route: /configuration
  display_fields:
    provider:
      # An analyst recognises an organization by its name, with the NPI beneath
      # it as the identifier. Individual providers carry no organization_name,
      # so they fall back to "Provider <id>" — the id is NPI-derived, so the
      # identifying number still shows. One name per entity, everywhere (UXA-304).
      title: organization_name
      subtitle: npi
    beneficiary:
      title: hic_number
      subtitle: birth_date
    claim:
      title: claim_id
      subtitle: service_date
    facility:
      title: facility_id
    policy:
      title: policy_id
      subtitle: title
    procedure_code:
      title: code
      subtitle: description
    regulation_section:
      title: citation
      subtitle: title
    provider_specialty:
      title: name
  roles:
    analyst:
      landing_page: alerts
      pages: [dashboard, alerts, investigation, cases, policy, knowledge_bases, rag_chat]
      permissions: [alerts:read, cases:write, policy:triage, feedback:write]
    supervisor:
      landing_page: dashboard
      pages: [dashboard, alerts, investigation, cases, policy, governance, knowledge_bases, rag_chat, configuration]
      permissions: [alerts:read, cases:assign]
