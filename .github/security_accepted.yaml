# Accepted-risk register for the dependency-audit gate (_security.12).
#
# The CI security gate fails on any HIGH/CRITICAL advisory that is not listed
# here. An entry is a decision with an owner and an expiry — not a mute button.
#
# Rules:
#   - Every entry needs `rationale` and `review_by`. `scripts/security_review_check.py`
#     fails when a `review_by` date has passed, so an acceptance cannot quietly
#     outlive the reasoning that justified it.
#   - Remove the entry when a fixed release ships. Do not extend `review_by`
#     without re-reading the advisory.
#   - The rationale must say why *this codebase* is unaffected, not that the
#     advisory looks unimportant.

pip: []

npm: []
