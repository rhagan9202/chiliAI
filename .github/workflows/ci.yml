name: CI

on:
  push:
    branches:
      - main
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (lint, typecheck, tests, audit)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Cache pip wheels
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('backend/pyproject.toml') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Install backend with all extras
        run: |
          python -m pip install --upgrade pip
          pip install uv
          pip install -e ".[dev,neo4j,qdrant,openai,anthropic,s3,sentence-transformers,analytics,postgres]" \
            || pip install -e ".[dev]"

      - name: Lint with ruff
        run: ruff check .

      - name: Type-check with pyright
        # No path argument: pyright honours tool.pyright.include in
        # pyproject.toml, which scopes strict checking to the hardened
        # modules. Passing "." would override that and check the whole tree.
        run: pyright

      - name: Run pytest with coverage gate
        run: pytest --cov --cov-report=xml --cov-report=term --cov-fail-under=85

      - name: Run production readiness focused backend checks
        working-directory: .
        run: uv run --project backend pytest backend/tests/api/test_analytics_router.py backend/tests/agent/test_workflow_tracking.py backend/tests/api/test_records_router.py backend/tests/records/test_service.py backend/tests/events/test_redis_streams.py backend/tests/ingestion/test_service.py -q

      - name: Upload backend coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-coverage
          path: backend/coverage.xml
          if-no-files-found: warn

      - name: Install pip-audit
        run: pip install pip-audit

      - name: Run pip-audit (fail on HIGH/CRITICAL)
        # --skip-editable: the project installs itself editable (chili-backend),
        # which is not on PyPI and cannot be audited. --strict is intentionally
        # omitted — it would fail on that un-auditable local package; pip-audit
        # still exits non-zero on any real dependency vulnerability.
        run: |
          pip-audit \
            --skip-editable \
            --vulnerability-service=pypi \
            --ignore-vuln GHSA-0000-0000-0000 \
            || pip-audit --skip-editable

  api-contracts:
    name: API contracts (OpenAPI + frontend schema drift)
    runs-on: ubuntu-latest
    needs: backend
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install backend dev dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e "backend[dev]"

      - name: Set up Node 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install frontend dependencies
        working-directory: chili_app
        run: npm ci --legacy-peer-deps || npm install --legacy-peer-deps

      - name: Export OpenAPI and regenerate frontend schema
        run: |
          python -m tools.export_openapi --output chili_app/openapi.json
          cd chili_app
          npm run codegen:api

      - name: Check generated contract drift
        run: git diff --exit-code -- chili_app/openapi.json chili_app/src/lib/api/schema.ts chili_app/src/api/contracts.ts

      - name: Run contract guardrails
        run: python scripts/contract_guardrails.py

  frontend:
    name: Frontend (lint, typecheck, tests, build, audit)
    runs-on: ubuntu-latest
    needs: api-contracts
    defaults:
      run:
        working-directory: chili_app
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Enable pnpm
        run: corepack enable

      - name: Cache npm
        uses: actions/cache@v4
        with:
          path: ~/.npm
          key: ${{ runner.os }}-npm-${{ hashFiles('chili_app/package.json') }}
          restore-keys: |
            ${{ runner.os }}-npm-

      - name: Install frontend dependencies
        run: npm ci --legacy-peer-deps || npm install --legacy-peer-deps

      - name: Lint with ESLint
        run: npm run lint

      - name: Type-check with tsc
        run: npx tsc --noEmit

      - name: Run unit tests
        run: npm run test:run

      - name: Run production readiness focused frontend checks
        working-directory: .
        run: pnpm --dir chili_app test -- src/pages/__tests__/InvestigationWorkbenchPage.test.tsx src/app/__tests__/router-routes.test.tsx src/pages/__tests__/AnalystCopy.test.tsx --run

      - name: Build production bundle
        run: npm run build

      - name: Upload frontend dist artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: chili_app/dist
          if-no-files-found: warn

      - name: Run npm audit (fail on HIGH/CRITICAL)
        run: npm audit --audit-level=high

  backlog:
    name: Backlog consistency (DAG + status invariants)
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run consistency pass in check mode
        run: python scripts/backlog_consistency.py --check

      - name: Run script unit tests with coverage gate
        run: |
          python -m pip install --upgrade pip
          pip install pytest pytest-cov
          pytest tests/scripts/test_backlog_consistency.py --cov=scripts.backlog_consistency --cov-fail-under=85
