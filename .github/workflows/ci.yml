name: CI

on:
  push:
    branches:
      # prod is the repo's mainline/default branch; main is retained for legacy.
      - main
      - prod
  pull_request:
  # Manual trigger so CI can be run on demand against the default branch.
  workflow_dispatch:
  # Nightly dependency-vulnerability sweep — catches newly-disclosed
  # advisories against pinned dependencies between human-driven CI runs.
  # 07:17 UTC offset to avoid the 00:00 hot-window. See BL-004.
  schedule:
    - cron: "17 7 * * *"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (lint, typecheck, tests, audit)
    runs-on: ubuntu-latest
    # Infrastructure services are brought up before any test runs (see the
    # "Bring up the service stack" step) and these env vars point the
    # integration tests at the published localhost ports so they execute
    # against real services instead of self-skipping.
    #
    # The api and worker containers are started too, so the live-stack e2e
    # tests actually run. CHILI_E2E_REQUIRE_STACK makes their absence a
    # failure rather than a silent skip — without it a stack that failed to
    # come up would leave every one of those tests skipped and the job green.
    env:
      # Pin the pyright binary to match the version pinned in pyproject (dev extra)
      # so the typecheck gate is deterministic and matches local development.
      PYRIGHT_PYTHON_FORCE_VERSION: "1.1.409"
      # DELIBERATELY chili_test, never the dev-stack `chili` DB. This job now
      # starts live api/worker containers, which use `chili` — and
      # tests/database/test_migrations.py runs `alembic downgrade base` against
      # DATABASE_URL, emptying every table. Pointing this at `chili` would wipe
      # the database those containers are serving, mid-suite, before the
      # live-stack e2e tests run. backend/tests/conftest.py documents the same
      # invariant (it has destroyed seeded demo state twice locally).
      # `chili_test` is migrated by conftest's _ensure_migrated_test_database.
      DATABASE_URL: postgresql://chili:chili@localhost:5432/chili_test
      REDIS_URL: redis://localhost:6379
      CHILI_E2E_REQUIRE_STACK: "1"
      CHILI_TEST_REDIS_URL: redis://localhost:6379
      QDRANT_URL: http://localhost:6333
      NEO4J_AUTH: neo4j/ci_password
      NEO4J_TEST_URI: bolt://localhost:7687
      NEO4J_TEST_USERNAME: neo4j
      NEO4J_TEST_PASSWORD: ci_password
      MINIO_ENDPOINT: localhost:9000
      MINIO_ACCESS_KEY: minioadmin
      MINIO_SECRET_KEY: minioadmin
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python 3.12
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Cache pip wheels
        uses: actions/cache@v6
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('backend/pyproject.toml') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Bring up the service stack
        # Single source of truth: the same infra services defined in the dev
        # compose file. --wait blocks until every container reports healthy, so
        # tests never start before the stack is ready. NEO4J_AUTH (job env)
        # enables Neo4j auth for the integration tests.
        working-directory: ${{ github.workspace }}
        run: |
          docker compose -f docker-compose.dev.yaml up -d --wait \
            redis postgres neo4j qdrant minio
          # The application containers are what the live-stack e2e tests talk
          # to. Started after the infra --wait so their migrations run against
          # a database that is already accepting connections.
          docker compose -f docker-compose.dev.yaml up -d --build api worker
          # Wait on the two API routes this job's tests use, NOT the script's
          # defaults: those include the Vite app on :5173, and this job starts
          # no `app` container (nothing depends on it — `app` depends on
          # `api`, not the reverse). Waiting on :5173 here can only time out.
          # /config/domain is the second probe for the reason
          # tests/e2e/stack_gate.py gives: a bare /health accepts any service
          # holding the port.
          scripts/wait_for_stack.sh \
            http://localhost:8000/health \
            http://localhost:8000/config/domain

      - name: Install backend with all extras
        # Every optional adapter is always installed; no silent fallback. If the
        # full install fails, CI fails here rather than quietly running a partial
        # dependency set.
        # Note on pip vs uv: local development is uv-managed (see CLAUDE.md);
        # this CI job deliberately installs into the runner's Python with pip
        # for cache/setup simplicity, and installs uv only for the one
        # `uv run --project backend` step below. This split is intentional.
        run: |
          python -m pip install --upgrade pip
          pip install uv
          pip install -e ".[dev,neo4j,qdrant,openai,anthropic,s3,sentence-transformers,analytics,auth,postgres,observability]"

      - name: Apply database migrations to the dev database
        # Scoped to `chili` explicitly: this migrates the database the live
        # api/worker containers serve, NOT the job's DATABASE_URL, which is
        # chili_test and is migrated by the pytest session fixture.
        env:
          DATABASE_URL: postgresql://chili:chili@localhost:5432/chili
        run: alembic upgrade head

      - name: Lint with ruff
        run: ruff check .

      - name: Type-check with pyright
        # No path argument: pyright honours tool.pyright.include in
        # pyproject.toml, which scopes strict checking to the hardened
        # modules. Passing "." would override that and check the whole tree.
        run: pyright

      - name: Type-check scripts/
        # scripts/ holds CI-enforced gates and was typechecked by nothing:
        # backend's [tool.pyright] include is scoped to backend/, tools/ has its
        # own config. Same standalone-program pattern, same reason.
        working-directory: ${{ github.workspace }}/scripts
        run: pyright

      - name: Type-check tools/
        # Repo-root tools/ (host-side demo/data-prep scripts) is typechecked
        # via its own tools/pyrightconfig.json, as a separate invocation from
        # the backend one above. The split originated when a since-deleted
        # backend/tools/ package shared the bare name "tools" (pyright
        # resolves a module name once per Program); kept for isolation — see
        # backend/pyproject.toml's [tool.pyright] comment.
        working-directory: ${{ github.workspace }}/tools
        run: pyright

      - name: Run pytest with coverage gate
        run: pytest --cov --cov-report=xml --cov-report=term --cov-fail-under=85

      - name: Run production readiness focused backend checks
        working-directory: .
        run: uv run --project backend pytest backend/tests/api/test_analytics_router.py backend/tests/agent/test_workflow_tracking.py backend/tests/api/test_records_router.py backend/tests/records/test_service.py backend/tests/events/test_redis_streams.py backend/tests/ingestion/test_service.py -q

      - name: Upload backend coverage report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: backend-coverage
          path: backend/coverage.xml
          if-no-files-found: warn

      - name: Install pip-audit
        run: pip install pip-audit

      - name: Check accepted-risk register and review currency (_security.12)
        # Runs before the audit so an expired acceptance fails loudly here
        # rather than silently continuing to suppress a real advisory below.
        working-directory: ${{ github.workspace }}
        run: |
          pip install pyyaml
          python scripts/security_review_check.py

      - name: Run pip-audit (fail on HIGH/CRITICAL)
        # --skip-editable: the project installs itself editable (chili-backend),
        # which is not on PyPI and cannot be audited. --strict is intentionally
        # omitted — it would fail on that un-auditable local package; pip-audit
        # still exits non-zero on any real dependency vulnerability.
        #
        # Ignored advisories are read from .github/security_accepted.yaml rather
        # than hardcoded here, so an exemption carries a rationale, an owner and
        # a review-by date that the step above enforces. An acceptance cannot
        # outlive its reasoning by being a flag nobody re-reads.
        working-directory: ${{ github.workspace }}
        run: |
          IGNORES=$(python - <<'EOF'
          import yaml
          reg = yaml.safe_load(open(".github/security_accepted.yaml")) or {}
          print(" ".join(f"--ignore-vuln {e['id']}" for e in (reg.get("pip") or [])))
          EOF
          )
          echo "Accepted (see .github/security_accepted.yaml): ${IGNORES:-none}"
          cd backend
          pip-audit \
            --skip-editable \
            --vulnerability-service=pypi \
            $IGNORES \
            || pip-audit --skip-editable $IGNORES

      - name: Tear down the service stack
        if: always()
        working-directory: ${{ github.workspace }}
        run: docker compose -f docker-compose.dev.yaml down -v

  api-contracts:
    name: API contracts (OpenAPI + frontend schema drift)
    runs-on: ubuntu-latest
    needs: backend
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python 3.12
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install backend with all extras
        # Full extras: export_openapi imports the application, which may load
        # optional adapters at import time. No fallback — fail loudly if the
        # full install breaks.
        run: |
          python -m pip install --upgrade pip
          pip install -e "backend[dev,neo4j,qdrant,openai,anthropic,s3,sentence-transformers,analytics,auth,postgres,observability]"

      - name: Set up Node 22
        uses: actions/setup-node@v7
        with:
          node-version: "22"

      - name: Install frontend dependencies
        working-directory: chili_app
        run: npm ci

      - name: Export OpenAPI and regenerate frontend schema
        run: |
          python -m tools.export_openapi --output chili_app/openapi.json
          cd chili_app
          npm run codegen:api

      - name: Check generated contract drift
        run: git diff --exit-code -- chili_app/openapi.json chili_app/src/lib/api/schema.ts chili_app/src/api/contracts.ts

      - name: Run contract guardrails
        run: python scripts/contract_guardrails.py

  frontend:
    name: Frontend (lint, typecheck, tests, build, audit)
    runs-on: ubuntu-latest
    needs: api-contracts
    defaults:
      run:
        working-directory: chili_app
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node 22
        uses: actions/setup-node@v7
        with:
          node-version: "22"

      - name: Cache npm
        uses: actions/cache@v6
        with:
          path: ~/.npm
          key: ${{ runner.os }}-npm-${{ hashFiles('chili_app/package.json') }}
          restore-keys: |
            ${{ runner.os }}-npm-

      # No --legacy-peer-deps: it omits peer dependencies, which left puppeteer
      # (a peer of @mermaid-js/mermaid-cli) out of node_modules and broke
      # `npm run render:architecture`. The dependency tree resolves cleanly
      # without it. No `|| npm install` fallback either — `npm ci` failing on a
      # package.json/lockfile mismatch is the drift signal, and `npm install`
      # would rewrite the lockfile in CI and hide it.
      - name: Install frontend dependencies
        run: npm ci

      - name: Lint with ESLint
        run: npm run lint

      - name: Type-check with tsc
        run: npx tsc --noEmit

      - name: Run unit tests
        run: npm run test:run

      - name: Run production readiness focused frontend checks
        run: npm run test:run -- src/pages/__tests__/InvestigationWorkbenchPage.test.tsx src/app/__tests__/router-routes.test.tsx src/pages/__tests__/AnalystCopy.test.tsx

      - name: Build production bundle
        run: npm run build

      - name: Upload frontend dist artifact
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: frontend-dist
          path: chili_app/dist
          if-no-files-found: warn

      - name: Run npm audit (fail on HIGH/CRITICAL)
        run: npm audit --audit-level=high

  e2e:
    name: End-to-end (Playwright against the full stack)
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    # The Playwright suite (39 spec files, 102 test cases as reported by
    # `npx playwright test --list`) previously ran in no job at all: lint,
    # tsc, vitest, build and backend pytest could all pass while the
    # alert-feed -> evidence -> workbench flow was broken. This job is the
    # gate for that.
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node 22
        uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: chili_app/package-lock.json

      - name: Install frontend dependencies
        working-directory: chili_app
        run: npm ci

      - name: Install Playwright browsers
        working-directory: chili_app
        run: npx playwright install --with-deps chromium

      - name: Bring up the full stack
        # make test-e2e owns the compose lifecycle and the readiness wait, so
        # the stack definition stays in one place. CHILI_DEV_ANONYMOUS_ROLE
        # matches the target so role-gated specs are reachable.
        run: make test-e2e

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: chili_app/playwright-report
          if-no-files-found: warn

      - name: Dump stack logs on failure
        if: failure()
        run: docker compose -f docker-compose.dev.yaml logs --no-color --tail=300

  backlog:
    name: Backlog consistency (DAG + status invariants)
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python 3.12
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Run consistency pass in check mode
        run: python scripts/backlog_consistency.py --check

      - name: Run script unit tests with coverage gate
        run: |
          python -m pip install --upgrade pip
          pip install pytest pytest-cov pyyaml
          pytest tests/scripts/test_backlog_consistency.py --cov=scripts.backlog_consistency --cov-fail-under=85
          pytest tests/scripts/test_security_review_check.py --cov=scripts.security_review_check --cov-fail-under=85

  migrations:
    name: Migrations (replay + snapshot drift)
    runs-on: ubuntu-latest
    # BL-042 / database.04 (workflow plumbing: _cicd.12). Independent of the
    # backend job: no `needs`, so a schema-drift failure is reported even when
    # unrelated backend tests are red, and existing jobs stay untouched.
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python 3.12
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install Alembic via the backend postgres extra
        # Only alembic + psycopg are needed; the [postgres] extra pins them to
        # the same versions the backend job resolves.
        run: |
          python -m pip install --upgrade pip
          pip install -e "backend[postgres]"

      - name: Run migration replay + snapshot drift gate
        # The script brings up only the compose postgres service itself (the
        # same service-container pattern as the backend job's alembic step)
        # and works in a scratch database, never the seeded `chili` one.
        run: scripts/ci_migration_check.sh

      - name: Tear down the service stack
        if: always()
        run: docker compose -f docker-compose.dev.yaml down -v
