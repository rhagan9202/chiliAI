services:
  # ---------- Application containers ----------

  app:
    build:
      context: ./chili_app
      target: build
    command: npm run dev -- --host 0.0.0.0
    ports:
      - "5173:5173"
    volumes:
      - ./chili_app/src:/app/src
      - ./chili_app/public:/app/public
      - ./chili_app/index.html:/app/index.html
      - ./chili_app/vite.config.ts:/app/vite.config.ts
    environment:
      - VITE_API_PROXY_TARGET=http://api:8000
      - VITE_WS_PROXY_TARGET=ws://api:8000
    depends_on:
      api:
        condition: service_healthy
    networks:
      - chili-net

  api:
    build:
      context: ./backend
    command: >
      sh -c "alembic upgrade head &&
      exec uvicorn api.app:create_app
      --factory --host 0.0.0.0 --port 8000 --reload
      --reload-dir /app/api
      --reload-dir /app/agent
      --reload-dir /app/ingestion
      --reload-dir /app/graph
      --reload-dir /app/vectorstore
      --reload-dir /app/embeddings
      --reload-dir /app/rag
      --reload-dir /app/llm
      --reload-dir /app/analytics
      --reload-dir /app/monitoring
      --reload-dir /app/shared
      --reload-dir /app/config
      --reload-dir /app/events
      --reload-dir /app/storage
      --reload-dir /app/database
      --reload-dir /app/records
      --reload-dir /app/cases
      --reload-exclude '*.pyc'
      --reload-exclude '__pycache__/*'
      --reload-exclude '*.egg-info/*'"
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app
      - chili-object-data:/app/data
    environment:
      - CHILI_ENV=local
      # Domain pack selector. Override on the host to retarget the platform,
      # e.g. `make dev-domain DOMAIN=food_supply_chain`. Must stay in lockstep
      # with the worker service below.
      - CHILI_CONFIG_PATH=${CHILI_CONFIG_PATH:-/app/config/defaults/medicare_fraud_cms_desynpuf.yaml}
      - CHILI_CONFIG_OVERLAY_PATH=${CHILI_CONFIG_OVERLAY_PATH:-}
      - CHILI_DEV_ANONYMOUS_ROLE=${CHILI_DEV_ANONYMOUS_ROLE:-viewer}
      - CHILI_KB_REPOSITORY_BACKEND=object_store
      - CHILI_ALERT_REPOSITORY_BACKEND=object_store
      - CHILI_WORKFLOW_RUN_STORE_BACKEND=redis
      - CHILI_EVENT_BUS_BACKEND=redis
      - CHILI_EVENT_BLOCK_MS=500
      - LOG_LEVEL=INFO
      - LOG_FORMAT=console
      - REDIS_URL=redis://redis:6379
      - DATABASE_URL=postgresql://chili:chili@postgres:5432/chili
      - NEO4J_URI=bolt://neo4j:7687
      - QDRANT_URL=http://qdrant:6333
      - MINIO_ENDPOINT=minio:9000
      - MINIO_ACCESS_KEY=minioadmin
      - MINIO_SECRET_KEY=minioadmin
    depends_on:
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy
      neo4j:
        condition: service_healthy
      qdrant:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 5s
      start_period: 10s
      retries: 3
    networks:
      - chili-net

  worker:
    build:
      context: ./backend
    command: python -m agent.coordinator
    ports:
      # Worker health server (agent/health.py): GET /health for the container
      # healthcheck below, GET /metrics for the BL-043 ingestion counters —
      # published so operators can scrape it from the host in dev.
      - "8001:8001"
    volumes:
      - ./backend:/app
      - chili-object-data:/app/data
    environment:
      - CHILI_ENV=local
      # Must match the API service's CHILI_CONFIG_PATH — api and worker always
      # move to a new domain pack together.
      - CHILI_CONFIG_PATH=${CHILI_CONFIG_PATH:-/app/config/defaults/medicare_fraud_cms_desynpuf.yaml}
      - CHILI_CONFIG_OVERLAY_PATH=${CHILI_CONFIG_OVERLAY_PATH:-}
      - CHILI_DEV_ANONYMOUS_ROLE=${CHILI_DEV_ANONYMOUS_ROLE:-viewer}
      - CHILI_WORKFLOW_RUN_STORE_BACKEND=redis
      - CHILI_EVENT_BUS_BACKEND=redis
      # Must match the API's repository backend so worker-persisted document
      # metadata (status, warning counts/reasons) is visible to API reads.
      - CHILI_KB_REPOSITORY_BACKEND=object_store
      - CHILI_EVENT_BLOCK_MS=500
      - LOG_LEVEL=INFO
      - LOG_FORMAT=console
      - REDIS_URL=redis://redis:6379
      - DATABASE_URL=postgresql://chili:chili@postgres:5432/chili
      - NEO4J_URI=bolt://neo4j:7687
      - QDRANT_URL=http://qdrant:6333
      - MINIO_ENDPOINT=minio:9000
      - MINIO_ACCESS_KEY=minioadmin
      - MINIO_SECRET_KEY=minioadmin
    depends_on:
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy
      neo4j:
        condition: service_healthy
      qdrant:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8001/health"]
      interval: 30s
      timeout: 5s
      start_period: 10s
      retries: 3
    networks:
      - chili-net

  # ---------- Infrastructure services ----------

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - chili-net

  postgres:
    image: timescale/timescaledb:latest-pg16
    command: ["postgres", "-c", "shared_preload_libraries=timescaledb"]
    ports:
      - "5432:5432"
    environment:
      - POSTGRES_DB=chili
      - POSTGRES_USER=chili
      - POSTGRES_PASSWORD=chili
    volumes:
      - postgres-data:/var/lib/postgresql/data
      # Creates the chili_test integration-test DB on fresh volumes so host
      # pytest can never target (and wipe) the dev `chili` DB by default.
      - ./infra/postgres/init-test-db.sql:/docker-entrypoint-initdb.d/init-test-db.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U chili -d chili"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - chili-net

  neo4j:
    image: neo4j:5
    ports:
      - "7474:7474"
      - "7687:7687"
    environment:
      # Defaults to disabled auth for local dev; CI overrides with NEO4J_AUTH
      # (e.g. "neo4j/<password>") so the Neo4j integration tests can authenticate.
      - NEO4J_AUTH=${NEO4J_AUTH:-none}
    volumes:
      - neo4j-data:/data
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:7474 || exit 1"]
      interval: 15s
      timeout: 10s
      start_period: 30s
      retries: 5
    networks:
      - chili-net

  qdrant:
    image: qdrant/qdrant:latest
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant-data:/qdrant/storage
    healthcheck:
      test: ["CMD-SHELL", "bash -c '</dev/tcp/localhost/6333'"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - chili-net

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      - MINIO_ROOT_USER=minioadmin
      - MINIO_ROOT_PASSWORD=minioadmin
    volumes:
      - minio-data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - chili-net

volumes:
  chili-object-data:
  redis-data:
  postgres-data:
  neo4j-data:
  qdrant-data:
  minio-data:

networks:
  chili-net:
    driver: bridge
